<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.barnyard.site; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Calendar &middot; Barnyard</title>
<link rel="stylesheet" href="shell.css?v=870e98a5">
<link rel="stylesheet" href="calendar.css?v=32d71e4f">
<script src="themes.js?v=e151fb94"></script>
</head>
<body data-shell="calendar" data-wide>

<main id="page" class="content">
  <div class="page-head">
    <div>
      <h1>Calendar</h1>
    </div>
    <div class="cal-tools">
      <button type="button" class="btn btn-sm" id="cal-add-event">Add an event</button>
      <button type="button" class="btn btn-sm" id="cal-add-renewal">Add a renewal</button>
      <button type="button" class="btn btn-sm" id="cal-ics">Download calendar (.ics)</button>
    </div>
  </div>

  <form class="cal-quick" id="cal-quick" hidden>
    <label class="cal-quick-l" for="cal-quick-title">Add a to-do</label>
    <input type="text" class="cal-input" id="cal-quick-title" maxlength="200" autocomplete="off" placeholder="Try “call host tomorrow 9am” or “renew domain 14 Mar”" aria-describedby="cal-quick-hint">
    <input type="date" class="cal-input cal-quick-date" id="cal-quick-date" aria-label="Date (optional; overrides a date in the words)">
    <button type="submit" class="btn btn-primary btn-sm">Add</button>
    <p class="cal-quick-hint dim" id="cal-quick-hint" aria-live="polite"></p>
  </form>

  <div class="cal-bar">
    <div class="cal-tabs" role="tablist" aria-label="Calendar views" id="cal-tabs"></div>
    <div class="cal-nav" id="cal-nav" hidden>
      <button type="button" class="btn btn-sm" id="cal-prev" aria-label="Previous">&larr;</button>
      <button type="button" class="btn btn-sm" id="cal-today">Today</button>
      <button type="button" class="btn btn-sm" id="cal-next" aria-label="Next">&rarr;</button>
    </div>
    <label class="cal-filter">Renewals
      <select id="cal-kind" aria-label="Show renewals of one kind"></select>
    </label>
  </div>

  <div id="cal-root" aria-live="polite">
    <p class="dim">Loading&hellip;</p>
  </div>

  <div class="cal-toast" id="cal-toast" role="status" hidden></div>

  <div class="cal-foot dim">
    <p>Keys: <kbd>t</kbd> today, <kbd>w</kbd> week, <kbd>p</kbd> plan, <kbd>n</kbd> new to-do, <kbd>e</kbd> new event, <kbd>r</kbd> new renewal, &larr; &rarr; change month or week, <kbd>Esc</kbd> closes details.</p>
  </div>

  <aside class="cal-drawer" id="cal-drawer" role="dialog" aria-modal="false" aria-labelledby="cal-drawer-title" hidden>
    <div class="cal-drawer-head">
      <h2 id="cal-drawer-title">Details</h2>
      <button type="button" class="btn btn-sm btn-quiet" id="cal-drawer-close" aria-label="Close details">Close</button>
    </div>
    <div class="cal-drawer-body" id="cal-drawer-body"></div>
  </aside>
</main>

<script src="shell.js?v=6ac90ccf"></script>
<script src="auth-gate.js?v=a1b7693a"></script>
<script src="calendar-logic.js?v=addd9d32"></script>
<script src="planner-engine.js?v=b9d86e13"></script>
<script src="plan-view.js?v=86a49e3d"></script>
<script src="calendar.js?v=c9037f4d"></script>
</body>
</html>
