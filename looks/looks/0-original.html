/* ---- the current look, rebuilt from shell.css / tiles.css values ---- */
.mk{--font-display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--font-mono:"IBM Plex Mono",Consolas,monospace;--side-w:232px;min-height:calc(100vh - 44px);background:var(--bg);color:var(--fg);font:14px/1.55 var(--font-body);display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
.mk[data-density="compact"]{font-size:13px;--gap:22px;--pad:11px}
.mk[data-density="comfortable"]{--gap:32px;--pad:16px}
.side{position:relative;z-index:1;padding:22px 14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px var(--font-display)}
.brand-name{font:700 20px/1 var(--font-display);letter-spacing:-.015em;color:var(--fg-strong)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-group{margin:16px 10px 4px;font-size:12px;color:var(--fg-dim)}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--fg);font-weight:500;text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--panel);color:var(--fg-strong);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;min-width:20px;padding:0 6px;text-align:center;font:500 11px/18px var(--font-mono);border-radius:9px;background:var(--attn);color:var(--bg)}
.side-foot{margin-top:auto;font-size:13px;color:var(--fg-dim);padding:0 8px}
main{position:relative;z-index:1;padding:34px 40px 60px;display:flex;flex-direction:column;gap:var(--gap)}
.hero h1{font:700 clamp(32px,4vw,48px)/1.05 var(--font-display);letter-spacing:-.028em;color:var(--fg-strong);margin:0}
.hero p{margin:10px 0 0;color:var(--fg-dim);font-size:16px}
.widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.w{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:calc(var(--pad) + 6px) calc(var(--pad) + 8px);box-shadow:0 1px 0 color-mix(in srgb,var(--fg-strong) 4%,transparent),0 12px 30px -18px color-mix(in srgb,var(--fg-strong) 40%,transparent)}
.w.lift{box-shadow:0 1px 0 color-mix(in srgb,var(--fg-strong) 6%,transparent),0 22px 40px -22px color-mix(in srgb,var(--accent) 45%,transparent)}
.w.span2{grid-column:span 2}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h2{margin:0;font:600 17px/1.3 var(--font-display);letter-spacing:-.005em;color:var(--fg-strong)}
.sec-head .sub,.sec-head a{font-size:13px;color:var(--fg-dim);text-decoration:none}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.need li{display:flex;align-items:center;gap:12px;padding:var(--pad);border-radius:10px;background:var(--panel-2);position:relative}
.need li::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--attn)}
.need li.alert::before{background:var(--alert)}
.need .t{flex:1;font-weight:500;color:var(--fg-strong)}
.need .m{font-size:12.5px;color:var(--fg-dim)}
.btn{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--font-body);cursor:pointer}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spine{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.spine li{position:relative;padding-left:8px}
.spine li::before{content:"";position:absolute;left:-26px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.spine .tm{font:12px var(--font-mono);color:var(--fg-dim);margin-right:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:20px;background:var(--panel-2);border:1px solid var(--line)}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.attn{color:var(--attn);background:var(--attn-soft);border-color:transparent}
.chip.alert{color:var(--alert);background:var(--alert-soft);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.svc{display:flex;flex-direction:column;gap:9px}
.svc div{display:flex;align-items:center;gap:10px;justify-content:space-between}
.svc .n{color:var(--fg-strong);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week div{border-radius:10px;background:var(--panel-2);padding:9px 8px;min-height:84px;font-size:12.5px}
.week b{display:block;color:var(--fg-strong);font:600 13px var(--font-display);margin-bottom:5px}
.flight{display:flex;flex-direction:column;gap:12px}
.flight .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.lane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:var(--pad)}
.lane .n{font:700 34px/1 var(--font-display);color:var(--fg-strong);letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:500 12px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--fg-dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
[hidden]{display:none!important}
@media (max-width:900px){.mk{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.widgets,.lanes{grid-template-columns:1fr}.w.span2{grid-column:auto}main{padding:20px}}
</style>
</head>

  var gb = document.createElement("optgroup"); gb.label = "Blues"; var go = document.createElement("optgroup"); go.label = "Others";
  DATA.all.forEach(function (t) { (t.group === "blue" ? gb : go).appendChild(opt(t.id, t.name, t.id === "amber")); });
  themeSel.appendChild(gb); themeSel.appendChild(go);
  if (!all.amber) themeSel.selectedIndex = 0;
  var bg = document.createElement("select");
  [["light", "Soft light"], ["pattern", "Lines and patterns"], ["ring", "Rings and rays"]].forEach(function (g) {
    var og = document.createElement("optgroup"); og.label = g[1];
    DATA.bgs.forEach(function (b) { if (b.group === g[0]) og.appendChild(opt(b.id, b.name, b.id === "plain")); });
    bg.appendChild(og);
  });
  var st = document.createElement("select"); ["subtle", "medium", "strong"].forEach(function (x) { st.appendChild(opt(x, x.charAt(0).toUpperCase() + x.slice(1), x === "medium")); });
  var dn = document.createElement("select"); [["comfortable", "Comfortable"], ["compact", "Compact"]].forEach(function (x) { dn.appendChild(opt(x[0], x[1], x[0] === "comfortable")); });
  var md = document.createElement("select"); [["system", "System"], ["light", "Light"], ["dark", "Dark"]].forEach(function (x) { md.appendChild(opt(x[0], x[1], x[0] === "system")); });
  bar.appendChild(lab("Theme ", "g-theme", themeSel)); bar.appendChild(lab("Light or dark ", "g-mode", md)); bar.appendChild(lab("Background ", "g-bg", bg));
  bar.appendChild(lab("Strength ", "g-bgs", st)); bar.appendChild(lab("Density ", "g-dens", dn));
  themeSel.addEventListener("change", apply);
  md.addEventListener("change", function () { modePref = md.value; apply(); });
  bg.addEventListener("change", function () { mk.setAttribute("data-bg", bg.value); bgEl.className = "mk-bg bgx-" + bg.value; });
  st.addEventListener("change", function () { mk.setAttribute("data-bgs", st.value); });
  dn.addEventListener("change", function () { mk.setAttribute("data-density", dn.value); });
  if (window.matchMedia) { try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply); } catch (e) { } }
  // the gallery page can set the mode through the URL: #mode=dark&theme=cobalt
  var h = (location.hash || "").replace("#", "").split("&").reduce(function (o, p) { var q = p.split("="); if (q[0]) o[q[0]] = q[1]; return o; }, {});
  if (h.theme && all[h.theme]) themeSel.value = h.theme;
  if (h.mode === "light" || h.mode === "dark") { modePref = h.mode; md.value = h.mode; }
  if (h.bg) { bg.value = h.bg; bgEl.className = "mk-bg bgx-" + bg.value; mk.setAttribute("data-bg", bg.value); }
  if (h.dens === "compact") { dn.value = "compact"; mk.setAttribute("data-density", "compact"); }
  apply();
  window.addEventListener("message", function (e) {
    var d = e.data; if (!d || d.type !== "look") return;
    if (d.mode) { modePref = d.mode; md.value = d.mode; }
    apply();
  });
})();
</script>
