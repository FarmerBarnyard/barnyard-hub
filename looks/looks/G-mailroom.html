/* Shared by every look mockup: colour tokens (driven by the real themes.js table), the real CSS-only backgrounds, and the mockup control strip.
   The control strip is NOT part of any look: it only lets the owner swap theme, mode, background, strength and density. */
:root {
  --bg: #0b1016; --panel: #121920; --panel-2: #172029; --line: #232e3a;
  --fg: #ced7e0; --fg-strong: #f2f5f8; --fg-dim: #8c99a7;
  --accent: #e8a33d; --accent-ink: #1b1304; --accent-soft: rgba(232,163,61,.12);

  --ok: #4cc38a; --ok-soft: rgba(76,195,138,.12);
  --alert: #ff7b6e; --alert-soft: rgba(255,123,110,.12);
  --info: #6aaaf0; --info-soft: rgba(106,170,240,.13);
  --side-w: 232px; --base: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---- mockup control strip ---- */
.mx { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 12px/1 system-ui, "Segoe UI", sans-serif; color: var(--fg); white-space: nowrap; overflow-x: auto; }
.mx b { color: var(--fg-strong); font-weight: 600; }
.mx label { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim); }
.mx select { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; height: 24px; color: var(--fg); }
.mx .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.mx .seg button { background: var(--panel); border: 0; padding: 0 9px; height: 24px; cursor: pointer; color: var(--fg-dim); }
.mx .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.mx .sp { flex: 1; }
.mx .hint { color: var(--fg-dim); }
#stage { position: fixed; top: 38px; left: 0; right: 0; bottom: 0; z-index: 1; }

/* G Mailroom: an e-mail client. Folders left, message list middle, reading pane right. Flat panes split by 1px lines, 2px radius at most, no cards, no accent rails.
   State is a flag and weight (unread = bold), never a coloured tile. */
.g { position: absolute; inset: 0; display: flex; flex-direction: column; font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--fg); }
:root[data-density="compact"] .g { font-size: 12px; }
.g-top { display: flex; align-items: center; gap: 16px; height: 40px; padding: 0 14px; background: color-mix(in srgb, var(--panel-2) 82%, transparent); border-bottom: 1px solid var(--line); }
.g-brand { font-weight: 650; font-size: 15px; color: var(--fg-strong); letter-spacing: .1px; }
.g-search { flex: 0 1 380px; }
.g-search input { width: 100%; height: 26px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); padding: 0 8px; }
.g-search input::placeholder { color: var(--fg-dim); }
.g-top .sp { flex: 1; }
.g-who { color: var(--fg-dim); }
.g-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 208px minmax(320px, 400px) 1fr; }
.g-body.wide { grid-template-columns: 208px minmax(520px, 1fr) 360px; }
.g-folders { background: color-mix(in srgb, var(--panel-2) 78%, transparent); border-right: 1px solid var(--line); padding: 8px 0; overflow: auto; }
.g-f { display: flex; justify-content: space-between; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 4px 14px; cursor: pointer; color: var(--fg); }
.g-f:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.g-f[aria-current="true"] { background: color-mix(in srgb, var(--fg) 11%, transparent); color: var(--fg-strong); font-weight: 600; }
.g-f .n { color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.g-f.has .n { color: var(--fg-strong); font-weight: 650; }
.g-f.flag .n { color: var(--alert); }
.g-fh { margin: 12px 14px 4px; color: var(--fg-dim); font-size: .92em; }
.g-list { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; position: relative; }
.g-gh { position: sticky; top: 0; z-index: 2; padding: 5px 12px 5px 34px; background: var(--panel-2); border-bottom: 1px solid var(--line); color: var(--fg-dim); font-weight: 600; }
.g-gh span { font-weight: 400; margin-left: 6px; }
.g-row { display: grid; grid-template-columns: 22px 1fr auto; column-gap: 6px; padding: 7px 12px 7px 8px; border-bottom: 1px solid var(--line); cursor: default; }
:root[data-density="compact"] .g-row { padding-top: 4px; padding-bottom: 4px; }
.g-row:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
.g-row[aria-selected="true"] { background: var(--accent-soft); }
.g-row[aria-selected="true"] .when, .g-row[aria-selected="true"] .l2 { color: var(--fg); }  /* keeps muted text above 4.5:1 on the selected row in every theme (Dusk dark fails with --fg-dim) */
.g-row .mk { grid-row: 1 / span 2; display: flex; justify-content: center; padding-top: 5px; }
.g-row .l1 { display: flex; justify-content: space-between; gap: 8px; min-width: 0; grid-column: 2 / span 2; }
.g-row .from { color: var(--fg-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row .when { color: var(--fg-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.g-row .l2 { grid-column: 2 / span 2; color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row.unread .from, .g-row.unread .l2 .sub { font-weight: 650; color: var(--fg-strong); }
.g-row .l2 .sub { color: var(--fg); }
.g-row.done { opacity: .6; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 2px; }
.pen { width: 10px; height: 13px; background: currentColor; clip-path: polygon(0 0, 100% 30%, 18% 62%, 18% 100%, 0 100%); }
.pen.alert { color: var(--alert); } .pen.attn { color: var(--attn); } .pen.ok { color: var(--ok); }
.g-row.flagged .l2 .sub { color: var(--fg-strong); }
.tick { color: var(--ok); font-weight: 700; line-height: 1; }
/* Ops board table view */
.g-tbl { width: 100%; border-collapse: collapse; }
.g-tbl th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); text-align: left; font-weight: 600; color: var(--fg-dim); padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.g-tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
:root[data-density="compact"] .g-tbl td { padding-top: 4px; padding-bottom: 4px; }
.g-tbl tr[aria-selected="true"] td { background: var(--accent-soft); }
.g-tbl td.id { color: var(--fg-dim); font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: .92em; }
.g-tbl td.mk { width: 24px; padding-right: 0; }
.g-tbl tr.unread td.t { font-weight: 650; color: var(--fg-strong); }
.g-tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.g-read { background: var(--panel); overflow: auto; padding: 22px 28px 40px; }
.g-read h1 { font-size: 20px; line-height: 1.25; margin: 0 0 12px; color: var(--fg-strong); font-weight: 600; max-width: 34ch; }
.g-meta { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0 0 16px; color: var(--fg); }
.g-meta dt { color: var(--fg-dim); } .g-meta dd { margin: 0; }
.g-read hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
.g-read p { max-width: 62ch; line-height: 1.6; font-size: 14px; margin: 0 0 12px; }
.g-act { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.g-act button { height: 28px; padding: 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.g-act button:hover { background: var(--panel-2); }
.g-act button.pri { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.g-act kbd, .g-status kbd { font: .86em "Cascadia Mono", Consolas, ui-monospace, monospace; border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; margin-left: 5px; color: var(--fg-dim); background: transparent; }
.g-act button.pri kbd { color: inherit; border-color: color-mix(in srgb, var(--bg) 45%, transparent); }
.g-empty { padding: 36px 20px; color: var(--fg-dim); }
.g-status { height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; background: color-mix(in srgb, var(--panel-2) 82%, transparent); border-top: 1px solid var(--line); color: var(--fg-dim); font-size: .95em; overflow: hidden; white-space: nowrap; }
.g-status b { color: var(--fg-strong); font-weight: 600; }
.g-status .down { color: var(--alert); font-weight: 600; }
@media (max-width: 980px) { .g-body, .g-body.wide { grid-template-columns: 170px 1fr; } .g-read { display: none; } }

  }
  function act(a) {
    var x = shown[sel]; if (!x) return;

    else if (a === "snooze") { snooze[x.id] = true; document.getElementById("g-status").firstChild.innerHTML += " &middot; snoozed"; }

  document.getElementById("stage").addEventListener("click", function (e) {
