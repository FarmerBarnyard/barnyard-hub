:root {

  --fg: #ced7e0; --fg-strong: #f2f5f8; --fg-dim: #8c99a7;

  --ok: #4cc38a; --ok-soft: rgba(76,195,138,.12);
  --alert: #ff7b6e; --alert-soft: rgba(255,123,110,.12);
  --info: #6aaaf0; --info-soft: rgba(106,170,240,.13);
  --side-w: 232px; --base: 14px; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- mockup control strip ---- */
.mx { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 12px/1 system-ui, "Segoe UI", sans-serif; color: var(--fg); white-space: nowrap; overflow-x: auto; }
.mx b { color: var(--fg-strong); font-weight: 600; }
.mx label { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim); }
.mx select { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; height: 24px; color: var(--fg); }
.mx .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.mx .seg button { background: var(--panel); border: 0; padding: 0 9px; height: 24px; cursor: pointer; color: var(--fg-dim); }
.mx .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.mx .sp { flex: 1; }
.mx .hint { color: var(--fg-dim); }
#stage { position: fixed; top: 38px; left: 0; right: 0; bottom: 0; z-index: 1; }

/* H Sheet: a workbook. Pages are sheet tabs, content is cells in a ruled grid, state is a word in a filled cell, the selected cell is outlined.
   No cards, no icons, no radius. A formula bar shows the full text of the selected cell. */
.h { position: absolute; inset: 10px 12px 12px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); font: 13px/1.3 "Aptos", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); min-width: 0; }
:root[data-density="compact"] .h { font-size: 12px; }
.h-title { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.h-title b { color: var(--fg-strong); font-weight: 600; }
.h-title span { color: var(--fg-dim); }
.h-fx { display: flex; align-items: stretch; height: 26px; border-bottom: 1px solid var(--line); background: var(--panel); }
.h-name { width: 74px; display: flex; align-items: center; padding: 0 10px; border-right: 1px solid var(--line); color: var(--fg-strong); font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: .95em; }
.h-fxl { width: 34px; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--line); color: var(--fg-dim); font-style: italic; font-family: "Cambria", Georgia, serif; }
.h-val { flex: 1; display: flex; align-items: center; padding: 0 10px; color: var(--fg-strong); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.h-scroll { flex: 1; min-height: 0; overflow: auto; background: var(--panel); }
.h-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 100%; }
.h-grid th, .h-grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); height: 24px; padding: 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-weight: 400; }
:root[data-density="compact"] .h-grid th, :root[data-density="compact"] .h-grid td { height: 20px; }
.h-grid thead tr.letters th { position: sticky; top: 0; z-index: 4; height: 20px; background: var(--panel-2); color: var(--fg-dim); text-align: center; padding: 0; font-size: .92em; }
.h-grid thead tr.hdr th { position: sticky; top: 20px; z-index: 3; background: var(--panel-2); color: var(--fg-strong); font-weight: 600; border-bottom: 2px solid var(--fg-dim); cursor: pointer; }
.h-grid thead tr.hdr th .srt { color: var(--fg-dim); margin-left: 4px; font-weight: 400; }
.h-grid .rn { position: sticky; left: 0; z-index: 2; width: 42px; min-width: 42px; text-align: center; padding: 0; background: var(--panel-2); color: var(--fg-dim); font-size: .92em; font-variant-numeric: tabular-nums; }
.h-grid thead .rn { z-index: 5; }
.h-grid tr.g td { background: var(--panel-2); color: var(--fg-strong); font-weight: 600; }
.h-grid td.num { text-align: right; font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: .95em; font-variant-numeric: tabular-nums; }
.h-grid td.dim { color: var(--fg-dim); }
.h-grid td.st { font-weight: 600; color: var(--fg-strong); }
.h-grid td.st.need { background: var(--accent-soft); } .h-grid td.st.alert { background: var(--alert-soft); } .h-grid td.st.warn { background: var(--attn-soft); }
.h-grid td.st.ok { background: var(--ok-soft); } .h-grid td.st.run { background: var(--info-soft); } .h-grid td.st.done { font-weight: 400; color: var(--fg-dim); }
.h-grid td.act { outline: 2px solid var(--accent); outline-offset: -2px; position: relative; z-index: 1; }
.h-grid td.act::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 6px; height: 6px; background: var(--accent); border: 1px solid var(--panel); }
.h-grid th.hl, .h-grid .rn.hl { background: color-mix(in srgb, var(--accent) 24%, var(--panel-2)); color: var(--fg-strong); }
.h-tabs { display: flex; align-items: stretch; height: 28px; background: var(--panel-2); border-top: 1px solid var(--line); }
.h-tabs button { background: none; border: 0; border-right: 1px solid var(--line); padding: 0 16px; cursor: pointer; color: var(--fg-dim); }
.h-tabs button:hover { color: var(--fg-strong); }
.h-tabs button[aria-selected="true"] { background: var(--panel); color: var(--fg-strong); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.h-tabs .sp { flex: 1; }
.h-tabs .hint { display: flex; align-items: center; padding: 0 12px; color: var(--fg-dim); }
.h-stat { display: flex; justify-content: space-between; height: 22px; align-items: center; padding: 0 12px; background: var(--panel-2); border-top: 1px solid var(--line); color: var(--fg-dim); font-size: .95em; }
.h-stat b { color: var(--fg-strong); font-weight: 600; }
.h-stat .down { color: var(--alert); font-weight: 600; }
