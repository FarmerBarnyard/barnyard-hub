/* I Paper Terminal: a text-mode screen. A fixed grid of characters (132 x 33), double-line outer frame, single-line panels, a selection bar in inverse video,
   function keys along the bottom. Monospace only, no radius, no icons. Colours come from the theme tokens: ink = --fg, paper = --panel. Pairs best with the light "paper" themes
   (Stone, Copper, Olive, Pine) or their soft dark sets, never neon. */
#stage.i-stage { display: flex; align-items: center; justify-content: center; }
.i-term { background: var(--panel); color: var(--fg); font-family: "IBM Plex Mono", "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", "Courier New", monospace; font-variant-ligatures: none; font-kerning: none; white-space: pre; border: 1px solid var(--line); cursor: default; user-select: none; }
.i-term .ln { display: block; height: 1em; }
.i-term .d { color: var(--fg-dim); } .i-term .s { color: var(--fg-strong); font-weight: 600; } .i-term .r { color: var(--alert); font-weight: 600; } .i-term .g { color: var(--ok); }
.i-term .t { color: var(--attn); font-weight: 600; } .i-term .n { color: var(--info); }
.i-term .v { background: var(--fg); color: var(--panel); } .i-term .va { background: var(--accent); color: var(--accent-ink); font-weight: 600; } .i-term .vd { background: var(--panel-2); color: var(--fg-strong); }
.i-probe { position: absolute; visibility: hidden; left: -9999px; top: 0; white-space: pre; font-family: "IBM Plex Mono", "Cascadia Mono", "Cascadia Code", Consolas, "Liberation Mono", "Courier New", monospace; font-size: 100px; }
