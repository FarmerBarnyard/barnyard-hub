/* ============ LOOK K: LINES. Each system or project is a line; its stops are stations; state is drawn on the station. ============ */
:root { --font-body: "IBM Plex Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace; --fs: 14px; --pad: 12px; --map-fs: 13px; --stroke: 9; }
:root[data-density="compact"] { --fs: 13px; --pad: 7px; --map-fs: 12px; --stroke: 8; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--fg); background: transparent; font: var(--fs)/1.45 var(--font-body); }
#page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px 100px; }
.sheet { background: color-mix(in srgb, var(--bg) 92%, transparent); padding: 0 0 36px; min-height: 100vh; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--fg-strong); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 26px; padding: 14px 0; border-bottom: 3px solid var(--fg-strong); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15em; color: var(--fg-strong); }
.brand svg { display: block; }
.top nav { display: flex; gap: 6px; }
.top nav button { background: none; border: 0; padding: 5px 12px; color: var(--fg); cursor: pointer; font-weight: 600; }
.top nav button[aria-current="page"] { background: var(--fg-strong); color: var(--bg); }
.who { margin-left: auto; color: var(--fg-dim); }
h1 { margin: 26px 0 4px; font-size: calc(var(--fs) * 1.75); line-height: 1.2; font-weight: 700; color: var(--fg-strong); max-width: 28em; }
.sub { margin: 0 0 20px; color: var(--fg-dim); max-width: 48em; }
/* the status board: one row per line */
.board { display: grid; border-top: 1px solid var(--line); }
.brow { display: grid; grid-template-columns: 40px 190px minmax(0, 1fr); gap: 14px; align-items: center; padding: var(--pad) 0; border-bottom: 1px solid var(--line); }
.bullet { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: var(--bg); }
.brow .nm { font-weight: 700; color: var(--fg-strong); font-size: 1.05em; }
.brow .st { color: var(--fg); }
.brow .st b { color: var(--fg-strong); }
/* the map */
.mapwrap { margin: 26px 0 8px; overflow-x: auto; }
svg.map { display: block; width: 100%; min-width: 860px; height: auto; font-family: var(--font-body); }
.map text { fill: var(--fg); font-size: var(--map-fs); }
.map .stn { font-weight: 600; fill: var(--fg-strong); }
.map .stat { fill: var(--fg-dim); font-size: calc(var(--map-fs) - 1px); }
.map .need .stn { font-weight: 700; }
.map .lname { font-weight: 700; font-size: calc(var(--map-fs) + 2px); fill: var(--fg-strong); }
.map .halo { paint-order: stroke; stroke: color-mix(in srgb, var(--bg) 92%, transparent); stroke-width: 4px; stroke-linejoin: round; }
.key { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 12px 0; border-top: 1px solid var(--line); color: var(--fg); }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.key svg { display: block; }
/* the notice lists */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 48px; margin-top: 20px; }
h2 { margin: 0 0 6px; font-size: 1.05em; color: var(--fg-strong); padding-bottom: 6px; border-bottom: 3px solid var(--fg-strong); }
.lst { list-style: none; margin: 0; padding: 0; }
.lst li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: calc(var(--pad) - 3px) 0; border-bottom: 1px solid var(--line); }
.lst time, .lst .d { font: 12.5px var(--font-mono); color: var(--fg-dim); font-variant-numeric: tabular-nums; padding-top: 1px; }
/* second view: lanes as vertical lines */
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 30px; margin-top: 8px; }
.lane h2 { display: flex; align-items: center; gap: 10px; border: 0; padding: 0; margin: 0 0 12px; }
.lane h2 .bullet { width: 28px; height: 28px; font-size: 14px; }
.vl { list-style: none; margin: 0; padding: 0 0 0 0; position: relative; }
.vl li { position: relative; padding: 0 0 var(--pad) 40px; min-height: 40px; }
.vl li::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 8px; background: var(--c); }
.vl li:first-child::before { top: 10px; }
.vl li:last-child::before { bottom: auto; height: 16px; }
.vl li.dashed::before { background: repeating-linear-gradient(180deg, var(--c) 0 7px, transparent 7px 12px); }
.vl .dot { position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 5px solid var(--c); }
.vl .need .dot, .vl li.need .dot { width: 26px; height: 26px; left: 2px; top: 2px; border: 5px solid var(--fg-strong); box-shadow: inset 0 0 0 4px var(--c); }
.vl li.done .dot { background: var(--c); }
.vl .t { color: var(--fg-strong); font-weight: 600; }
.vl .m { color: var(--fg-dim); font-size: .93em; }
.vl .m b { color: var(--fg-strong); }
.vl li.more .dot { width: 14px; height: 14px; left: 8px; top: 8px; border-width: 3px; }
[hidden] { display: none !important; }
@media (max-width: 800px) { .top { flex-wrap: wrap; gap: 8px 16px; } .who { margin-left: 0; width: 100%; } #page { padding: 0 14px 100px; } .cols { grid-template-columns: 1fr; } .brow { grid-template-columns: 40px minmax(0, 1fr); } .brow .st { grid-column: 2; } }
</style>
</head>
<body>
<div id="page"><div class="sheet">
  <header class="top">
    <span class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12.5" fill="none" stroke="currentColor" stroke-width="4"/><rect x="2" y="12.5" width="26" height="5" fill="currentColor"/></svg>Barnyard</span>
    <nav aria-label="Pages"><button type="button" data-v="map" aria-current="page">Network</button><button type="button" data-v="ops">Ops board</button></nav>
    <span class="who">Alex &middot; <span data-mk-theme-name></span></span>
  </header>
  <main>
    <section id="v-map" aria-labelledby="h-map">
      <h1 id="h-map"></h1>
      <p class="sub">Each system or project is a line. A solid line is done or running, a dashed line is planned. The ringed station is the next stop that needs you.</p>
      <div class="board" id="status"></div>
      <div class="mapwrap"><svg class="map" id="map" viewBox="0 0 1000 600" role="img" aria-label="Network map of three lines and their stations"></svg></div>
      <div class="key" id="key" aria-label="Key"></div>
      <div class="cols">
        <div><h2>Changes today</h2><ul class="lst" id="changes"></ul></div>
        <div><h2>Coming up</h2><ul class="lst" id="coming"></ul></div>
      </div>
    </section>
    <section id="v-ops" hidden aria-labelledby="h-ops">
      <h1 id="h-ops"></h1>
      <p class="sub">Each lane of the Ops board is a line. Stops further down are later. A ringed stop needs you.</p>
      <div class="lanes" id="lanes"></div>
    </section>
  </main>
</div></div>

    var d = "M" + pts.map(function (p) { return p[0] + " " + p[1]; }).join(" L");
    var g = mk("g", { "data-line": id }, svgEl);
    mk("path", { d: d, fill: "none", stroke: COL[id], "stroke-width": "var(--stroke)", "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    return g;
  }
  function station(id, s, g) {
    var x = s[0], y = s[1], kind = s[4], side = s[5], c = COL[id];
    var grp = mk("g", { class: kind === "need" ? "need" : "" }, g);
    var ring = (kind === "need") ? 13 : (kind === "plan" || kind === "ok") ? 9.5 : 10;
    if (kind === "need") { mk("circle", { cx: x, cy: y, r: 14, fill: "var(--bg)", stroke: "var(--fg-strong)", "stroke-width": 5 }, grp); mk("circle", { cx: x, cy: y, r: 5, fill: c }, grp); }
    else if (kind === "done") { mk("circle", { cx: x, cy: y, r: 10, fill: c, stroke: "var(--bg)", "stroke-width": 3 }, grp); }
    else if (kind === "prog") { mk("circle", { cx: x, cy: y, r: 11, fill: "var(--bg)", stroke: c, "stroke-width": 5 }, grp); mk("path", { d: "M" + x + " " + (y - 6) + " A6 6 0 0 0 " + x + " " + (y + 6) + " Z", fill: c }, grp); }
    else if (kind === "down") { mk("circle", { cx: x, cy: y, r: 13, fill: "var(--bg)", stroke: "var(--alert)", "stroke-width": 5 }, grp); mk("path", { d: "M" + (x - 5) + " " + (y - 5) + " L" + (x + 5) + " " + (y + 5) + " M" + (x + 5) + " " + (y - 5) + " L" + (x - 5) + " " + (y + 5), stroke: "var(--alert)", "stroke-width": 3.2, "stroke-linecap": "round" }, grp); }
    else if (kind === "warn") { mk("rect", { x: x - 11, y: y - 11, width: 22, height: 22, transform: "rotate(45 " + x + " " + y + ")", fill: "var(--bg)", stroke: "var(--alert)", "stroke-width": 5 }, grp); }
    else if (kind === "over") { mk("circle", { cx: x, cy: y, r: 12, fill: "var(--bg)", stroke: "var(--alert)", "stroke-width": 5, "stroke-dasharray": "5 4" }, grp); }
    else { mk("circle", { cx: x, cy: y, r: 9.5, fill: "var(--bg)", stroke: c, "stroke-width": 5 }, grp); }
    // label
    var nl = wrap(s[2], 21), cls = "halo ";
    var tx = x, anchor = "middle", ty;
    if (side === "right") { tx = x + 24; anchor = "start"; ty = y - ((nl.length - 1) * 8) + 2; }
    else if (side === "up") { ty = y - 24 - (nl.length - 1) * 15 - 16; } else { ty = y + 32; }
    var t = mk("text", { x: tx, y: ty, "text-anchor": anchor }, grp);
    nl.forEach(function (ln, i) { var sp = mk("tspan", { x: tx, dy: i === 0 ? 0 : 15, class: "stn halo" }, t); sp.textContent = ln; });
    var t2 = mk("text", { x: tx, y: ty + nl.length * 15 + 1, "text-anchor": anchor, class: "stat halo" }, grp); t2.textContent = s[3];
  }
  ["R", "S", "H"].forEach(function (id) {
    var ln = L[id], first = ln.st[0], last = ln.st[ln.st.length - 1];
    var g = track(id, [[52, ln.y], [last[0] + 26, ln.y]]);
    if (ln.solidTo < 99999) {      // planned part drawn dashed over a knock-out
      var cut = mk("rect", { x: ln.solidTo + 14, y: ln.y - 8, width: last[0] + 34 - ln.solidTo - 14, height: 16, fill: "var(--bg)" }, g);
      mk("path", { d: "M" + (ln.solidTo + 14) + " " + ln.y + " L" + (last[0] + 26) + " " + ln.y, fill: "none", stroke: COL[id], "stroke-width": "var(--stroke)", "stroke-dasharray": "12 9", "stroke-linecap": "butt" }, g);
    }
    if (ln.branch) { mk("path", { d: "M" + ln.branch.pts.map(function (p) { return p.join(" "); }).join(" L"), fill: "none", stroke: COL[id], "stroke-width": "var(--stroke)", "stroke-linejoin": "round", "stroke-linecap": "round" }, g); }
    // the bullet with the line's letter and its name
    mk("circle", { cx: 52, cy: ln.y, r: 19, fill: COL[id] }, g);
    var tl = mk("text", { x: 52, y: ln.y + 6, "text-anchor": "middle", style: "font-weight:700;font-size:18px;fill:" + INK[id] }, g); tl.textContent = ln.name.charAt(0);
    var nm = mk("text", { x: 30, y: ln.y + 50, class: "lname" }, g); nm.textContent = ln.name;
    ln.st.forEach(function (s) { station(id, s, g); });
    if (ln.branch) ln.branch.st.forEach(function (s) { station(id, s, g); });
  });
  // the interchange between Backups (Servers) and Backup restore test (Housekeeping)
  var ix = mk("g", {}, svgEl);
  svgEl.insertBefore(ix, svgEl.firstChild);
  mk("line", { x1: 790, y1: 340, x2: 790, y2: 520, stroke: "var(--fg-strong)", "stroke-width": 12, "stroke-linecap": "round" }, ix);
  mk("line", { x1: 790, y1: 340, x2: 790, y2: 520, stroke: "var(--bg)", "stroke-width": 5, "stroke-linecap": "round" }, ix);
  var it = mk("text", { x: 806, y: 436, class: "stat halo" }, svgEl); it.textContent = "interchange: same backups";

  // ---- status board
  var board = document.getElementById("status");
  var rows = [
    ["R", "Project Atlas", "<b>1 stop needs you today.</b> Sign off the first run. Next after that: First real Setup run, Thu 26 Nov."],
    ["S", "Servers", "<b>" + (down ? esc(down.name) + " is down, " + downMin + " minutes.</b> " : "") + "Backups degraded since 03:10. Four stops running normally."],
    ["H", "Housekeeping", "<b>3 stops need you.</b> Backup restore test is 5 days overdue; domain renewal due 28 Nov; choose the look."]
  ];
  board.innerHTML = rows.map(function (r) { return '<div class="brow"><span class="bullet" style="background:' + COL[r[0]] + ';color:' + INK[r[0]] + '">' + r[1].charAt(0) + '</span><span class="nm">' + r[1] + '</span><span class="st">' + r[2] + '</span></div>'; }).join("");

  // ---- key
  function sym(kind) {
    var s = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">';
    var c = "var(--fg)";
    if (kind === "done") s += '<circle cx="13" cy="13" r="8" fill="' + c + '"/>';
    if (kind === "plan") s += '<line x1="0" y1="13" x2="26" y2="13" stroke="' + c + '" stroke-width="5" stroke-dasharray="6 5"/>';
    if (kind === "solid") s += '<line x1="0" y1="13" x2="26" y2="13" stroke="' + c + '" stroke-width="5"/>';
    if (kind === "prog") s += '<circle cx="13" cy="13" r="8" fill="var(--bg)" stroke="' + c + '" stroke-width="4"/><path d="M13 7 A6 6 0 0 0 13 19 Z" fill="' + c + '"/>';
    if (kind === "need") s += '<circle cx="13" cy="13" r="10" fill="var(--bg)" stroke="var(--fg-strong)" stroke-width="4"/><circle cx="13" cy="13" r="3.5" fill="' + c + '"/>';
    if (kind === "down") s += '<circle cx="13" cy="13" r="10" fill="var(--bg)" stroke="var(--alert)" stroke-width="4"/><path d="M9 9 L17 17 M17 9 L9 17" stroke="var(--alert)" stroke-width="2.6" stroke-linecap="round"/>';
    if (kind === "warn") s += '<rect x="5" y="5" width="16" height="16" transform="rotate(45 13 13)" fill="var(--bg)" stroke="var(--alert)" stroke-width="4"/>';
    if (kind === "over") s += '<circle cx="13" cy="13" r="9" fill="var(--bg)" stroke="var(--alert)" stroke-width="4" stroke-dasharray="4 3.5"/>';
    return s + "</svg>";
  }
  document.getElementById("key").innerHTML = [["solid", "Running or done"], ["plan", "Planned"], ["done", "Done"], ["prog", "In progress"], ["need", "Needs you"], ["down", "Down"], ["warn", "Degraded"], ["over", "Overdue"]].map(function (k) { return "<span>" + sym(k[0]) + k[1] + "</span>"; }).join("");

  // ---- lists
  document.getElementById("changes").innerHTML = C.since_last_looked.map(function (e) { return "<li><time>" + e.t + "</time><span>" + esc(e.text) + "</span></li>"; }).join("");
  var dn = { Tue: "Tue 24", Wed: "Wed 25", Thu: "Thu 26", Fri: "Fri 27", Sat: "Sat 28", Sun: "Sun 29", Mon: "Mon 30" };
  var comingRows = [];
  C.week.forEach(function (d) { d.items.forEach(function (x) { comingRows.push([dn[d.day], x]); }); });
  comingRows.splice(4, 0, ["Sat 28", "Approve renewal: barnyard.site domain, due"]);
  document.getElementById("coming").innerHTML = comingRows.map(function (r) { return '<li><span class="d">' + r[0] + "</span><span>" + esc(r[1]) + "</span></li>"; }).join("");

  // ---- second view: lanes as vertical lines
  var lanes = [
    ["N", "Needs you", "var(--attn)", C.ops_board[0].n, [["it_a2", "Sign off the Setup first run", "today", 1], ["it_a1", "Approve renewal: barnyard.site domain", "due 28 Nov", 1], ["it_a5", "Backup restore test is overdue", "due 19 Nov, overdue", 1]]],
    ["P", "In progress", "var(--accent)", C.ops_board[1].n, [["it_b1", "Project Atlas: build step 1", "reads 7 of 9", 0], ["it_b2", "Vulnerability clean-up (14 open)", "due 30 Nov", 0]]],
    ["S", "Soaking", "var(--info)", C.ops_board[2].n, []],
    ["B", "Backlog", "var(--fg-dim)", C.ops_board[3].n, [["it_c1", "Cloudflare Access in front of the dashboard", "no date", 0], ["it_c2", "VPS host purchase (late)", "no date", 0]]]
  ];
  document.getElementById("lanes").innerHTML = lanes.map(function (l) {
    var items = l[4].map(function (r, i) { return '<li class="' + (r[3] ? "need" : "") + (l[1] === "Backlog" || l[1] === "In progress" && i > 0 ? " dashed" : "") + '" style="--c:' + l[2] + '"><span class="dot"></span><div class="t">' + esc(r[1]) + '</div><div class="m">' + esc(r[0]) + " &middot; " + esc(r[2]) + "</div></li>"; }).join("");
    var shown = l[4].length, more = l[3] - shown;
    if (more > 0) items += '<li class="more dashed" style="--c:' + l[2] + '"><span class="dot"></span><div class="m"><b>' + more + (shown ? " more" : " items") + "</b>" + (l[1] === "Soaking" ? ", waiting to see if they hold" : ", not shown") + "</div></li>";
    return '<section class="lane"><h2><span class="bullet" style="background:' + l[2] + ';color:' + (l[2] === "var(--accent)" ? "var(--accent-ink)" : "var(--bg)") + '">' + l[0] + "</span>" + l[1] + " (" + l[3] + ')</h2><ul class="vl">' + items + "</ul></section>";
  }).join("");

  var tabs = document.querySelectorAll(".top nav button");
  tabs.forEach(function (b) { b.addEventListener("click", function () { tabs.forEach(function (o) { o.removeAttribute("aria-current"); }); b.setAttribute("aria-current", "page"); document.getElementById("v-map").hidden = b.dataset.v !== "map"; document.getElementById("v-ops").hidden = b.dataset.v !== "ops"; }); });
  mkInit([]);
  if (MK.view === "ops") tabs[1].click();
})();
</script>
