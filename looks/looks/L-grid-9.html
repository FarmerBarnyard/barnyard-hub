/* ============ LOOK L: GRID 9. A strict nine-column modular grid. One typeface, four sizes, flush left, hairlines, no boxes. ============ */
:root { --font: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif; --fs: 15px; --row: 11px; --gap: 20px; --hero: clamp(40px, 6.2vw, 68px); --count: 38px; }
:root[data-density="compact"] { --fs: 14px; --row: 6px; --hero: clamp(34px, 5vw, 54px); --count: 30px; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; color: var(--fg); background: transparent; font: 400 var(--fs)/1.4 var(--font); font-variant-numeric: tabular-nums; }
#page { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 48px 90px; }
.sheet { position: relative; background: color-mix(in srgb, var(--bg) 92%, transparent); padding: 0 0 40px; min-height: 100vh; }
a, button { font: inherit; }
:focus-visible { outline: 2px solid var(--fg-strong); outline-offset: 2px; }
.g9 { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); column-gap: var(--gap); }
/* the visible grid, on request */
.guides { position: absolute; inset: 0 0 0 0; pointer-events: none; display: none; }
.guides.on { display: grid; }
.guides i { background: color-mix(in srgb, var(--accent) 7%, transparent); border-left: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-right: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.top { padding: 14px 0 12px; border-top: 6px solid var(--fg-strong); align-items: baseline; }
.top .name { grid-column: 1 / span 2; font-weight: 700; color: var(--fg-strong); }
.top nav { grid-column: 3 / span 4; display: flex; gap: 28px; }
.top nav button { background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg); }
.top nav button[aria-current="page"] { font-weight: 700; color: var(--fg-strong); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.top .when { grid-column: 8 / span 2; color: var(--fg-dim); }
.hero { padding: 54px 0 46px; border-top: 1px solid var(--fg-strong); }
.hero h1 { grid-column: 1 / span 6; margin: 0; font-weight: 700; font-size: var(--hero); line-height: 1.03; letter-spacing: -.025em; color: var(--fg-strong); }
.hero p { grid-column: 7 / span 3; margin: 0; align-self: end; max-width: 26em; }
/* a section: rule, then heading in columns 1-2 and rows in 3-9 */
.sec { border-top: 1px solid var(--fg-strong); padding: var(--row) 0 calc(var(--row) * 2.4); }
.sec > h2 { grid-column: 1 / span 2; margin: calc(var(--row) * .35) 0 0; font-size: var(--fs); font-weight: 700; color: var(--fg-strong); }
.rows { grid-column: 3 / span 7; display: block; }
.r { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: var(--gap); padding: calc(var(--row) * .75) 0; border-top: 1px solid var(--line); }
.r:first-child { border-top: 0; padding-top: calc(var(--row) * .35); }
.r .a { grid-column: 1 / span 1; color: var(--fg-dim); }
.r .b { grid-column: 2 / span 4; color: var(--fg-strong); }
.r .c { grid-column: 6 / span 2; color: var(--fg-dim); }
.r .a, .r .b, .r .c { min-width: 0; overflow-wrap: anywhere; }
.r.strong .b { font-weight: 700; }
.r .dn { font-weight: 700; color: var(--alert); }
.r .dg { font-weight: 700; color: var(--attn); }
.r .ok { color: var(--fg-dim); }
/* counts: numerals are data in a row, not tiles */
.counts { padding: 22px 0 6px; }
.counts .n { font-size: var(--count); font-weight: 700; line-height: 1; color: var(--fg-strong); letter-spacing: -.02em; }
.counts .l { margin-top: 6px; color: var(--fg); }
.counts > div { grid-column: span 2; }
.counts > div:first-child { grid-column: 3 / span 2; }
.lane-h { display: flex; align-items: baseline; gap: 14px; padding: 4px 0 0; margin: 0 0 10px; }
.lane-h .n { font-size: var(--count); font-weight: 700; color: var(--fg-strong); line-height: 1; letter-spacing: -.02em; }
.lane-h .l { font-weight: 700; color: var(--fg-strong); }
.pagehd { padding: 54px 0 34px; border-top: 1px solid var(--fg-strong); }
.pagehd h1 { grid-column: 1 / span 6; margin: 0; font-weight: 700; font-size: calc(var(--hero) * .78); line-height: 1.05; letter-spacing: -.02em; color: var(--fg-strong); }
.pagehd p { grid-column: 7 / span 3; margin: 0; align-self: end; }
.otab { grid-column: 1 / span 9; }
.otab .r { grid-template-columns: repeat(9, minmax(0, 1fr)); }
.otab .r .a { grid-column: 1 / span 2; font-variant-numeric: tabular-nums; }
.otab .r .b { grid-column: 3 / span 4; }
.otab .r .c { grid-column: 7 / span 1; }
.otab .r .d { grid-column: 8 / span 2; color: var(--fg-dim); }
.otab .lh { border-top: 1px solid var(--fg-strong); padding-top: var(--row); margin-top: calc(var(--row) * 2); }
.otab .lh:first-child { margin-top: 0; }
[hidden] { display: none !important; }
@media (max-width: 860px) { #counts { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; row-gap: 16px; } #counts > div { grid-column: auto !important; } #page { padding: 0 18px 90px; } .top .name, .top nav, .top .when, .hero h1, .hero p, .sec > h2, .rows, .pagehd h1, .pagehd p, .otab { grid-column: 1 / -1; } .top { row-gap: 8px; } .hero p, .pagehd p { margin-top: 18px; } .r { grid-template-columns: 70px 1fr; } .r .a { grid-column: 1; } .r .b { grid-column: 2; } .r .c { grid-column: 2; } .otab .r { grid-template-columns: 70px 1fr; } .otab .r .a, .otab .r .b, .otab .r .c, .otab .r .d { grid-column: 2; } .otab .r .a { grid-column: 1; grid-row: 1; } .counts > div, .counts > div:first-child { grid-column: span 4; margin-bottom: 14px; } }
</style>
</head>

<div id="page"><div class="sheet">
  <div class="guides g9" id="guides" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <header class="top g9">
    <span class="name">Barnyard</span>
    <nav aria-label="Pages"><button type="button" data-v="over" aria-current="page">Overview</button><button type="button" data-v="ops">Ops board</button></nav>

  <main>

      <section class="sec g9"><h2>Needs you</h2><div class="rows" id="need"></div></section>
      <section class="sec g9"><h2>In progress</h2><div class="rows" id="prog"></div></section>
      <section class="sec g9"><h2>Services</h2><div class="rows" id="svc"></div></section>
      <section class="sec g9"><h2>Today</h2><div class="rows" id="today"></div></section>
      <section class="sec g9"><h2>This week</h2><div class="rows" id="week"></div></section>
    </div>
    <div id="v-ops" hidden>
      <section class="pagehd g9" aria-labelledby="h-ops"><h1 id="h-ops"></h1><p>Sorted by lane, then by due date. Items with no date come last in their lane.</p></section>
      <div class="g9"><div class="otab" id="otab"></div></div>
    </div>
  </main>
</div></div>

  document.getElementById("otab").innerHTML = lanes.map(function (l, i) {
    var items = C.second_view_ops_rows.filter(function (r) { return r[2] === l[0]; }).sort(function (a, b) { return order(a[3]) - order(b[3]); });
    var more = l[2] - items.length;
    return '<div class="lh"><div class="lane-h"><span class="n">' + l[2] + '</span><span class="l">' + l[1] + "</span></div>" + items.map(function (r) { return '<div class="r"><span class="a">' + esc(r[0]) + '</span><span class="b">' + esc(r[1]) + '</span><span class="c">' + esc(r[2]) + '</span><span class="d">' + (r[3] === "-" ? "no date" : esc(r[3])) + "</span></div>"; }).join("") + (more > 0 ? '<div class="r"><span class="a"></span><span class="b" style="color:var(--fg-dim)">' + more + ' more not shown</span><span class=\"c\"></span><span class=\"d\"></span></div>' : '') + "</div>";
  }).join("");

  var tabs = document.querySelectorAll(".top nav button");
  tabs.forEach(function (b) { b.addEventListener("click", function () { tabs.forEach(function (o) { o.removeAttribute("aria-current"); }); b.setAttribute("aria-current", "page"); document.getElementById("v-over").hidden = b.dataset.v !== "over"; document.getElementById("v-ops").hidden = b.dataset.v !== "ops"; }); });
  window.mkOnChange = function (m) { document.getElementById("guides").classList.toggle("on", !!m.extra.grid); };
  mkInit([{ id: "grid", label: "Show the nine columns", value: false }]);
  if (MK.view === "ops") tabs[1].click();
})();
</script>
</body>
