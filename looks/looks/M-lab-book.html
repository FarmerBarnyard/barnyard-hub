*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);}
button,select,input{font:inherit;color:inherit}
:root{
--bg:#0b1016;--panel:#121920;--panel-2:#172029;--line:#232e3a;--fg:#ced7e0;--fg-strong:#f2f5f8;--fg-dim:#8c99a7;
--accent:#e8a33d;--accent-ink:#1b1304;--accent-soft:rgba(232,163,61,.12);--attn:#a891ff;--attn-soft:rgba(168,145,255,.12);
--ok:#4cc38a;--ok-soft:rgba(76,195,138,.12);--alert:#ff7b6e;--alert-soft:rgba(255,123,110,.12);--info:#6aaaf0;--info-soft:rgba(106,170,240,.13);
--side-w:0px;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
:root[data-bgs="subtle"] .bg{opacity:.5}:root[data-bgs="medium"] .bg{opacity:.85}:root[data-bgs="strong"] .bg{opacity:1}
.bgx-glow { background: radial-gradient(60% 55% at 88% -8%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 72%), radial-gradient(50% 45% at -6% 104%, color-mix(in srgb, var(--attn) 34%, transparent), transparent 70%); }
.bgx-mesh { background: radial-gradient(40% 40% at 12% 18%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 70%), radial-gradient(38% 40% at 86% 22%, color-mix(in srgb, var(--attn) 32%, transparent), transparent 70%), radial-gradient(44% 44% at 70% 92%, color-mix(in srgb, var(--info) 32%, transparent), transparent 70%), radial-gradient(36% 36% at 6% 86%, color-mix(in srgb, var(--ok) 24%, transparent), transparent 70%); }
.bgx-aurora { background: linear-gradient(112deg, transparent 12%, color-mix(in srgb, var(--accent) 34%, transparent) 34%, color-mix(in srgb, var(--attn) 32%, transparent) 50%, color-mix(in srgb, var(--info) 30%, transparent) 66%, transparent 88%), radial-gradient(60% 50% at 20% 100%, color-mix(in srgb, var(--attn) 20%, transparent), transparent 70%); background-size: 160% 70%, 100% 100%; background-repeat: no-repeat; background-position: 30% 0, 0 0; -webkit-mask-image: linear-gradient(180deg, #000 20%, transparent 95%); mask-image: linear-gradient(180deg, #000 20%, transparent 95%); }
.bgx-spotlight { background: radial-gradient(34% 42% at 50% -6%, color-mix(in srgb, var(--fg-strong) 22%, transparent), transparent 72%), radial-gradient(80% 62% at 50% -12%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 74%); }
.bgx-horizon { background: linear-gradient(180deg, transparent 30%, color-mix(in srgb, var(--accent) 26%, transparent) 75%, color-mix(in srgb, var(--attn) 38%, transparent) 100%), repeating-linear-gradient(180deg, transparent 0 22px, color-mix(in srgb, var(--accent) 12%, transparent) 22px 23px); }
.bgx-dots { background-image: radial-gradient(color-mix(in srgb, var(--fg-dim) 60%, transparent) 1.2px, transparent 1.6px); background-size: 24px 24px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); }
.bgx-grid { background-image: linear-gradient(color-mix(in srgb, var(--fg-dim) 38%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--fg-dim) 38%, transparent) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(90% 80% at 50% 0%, #000 10%, transparent 80%); mask-image: radial-gradient(90% 80% at 50% 0%, #000 10%, transparent 80%); }
.bgx-blueprint { background-image: linear-gradient(color-mix(in srgb, var(--info) 40%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--info) 40%, transparent) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--info) 18%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--info) 18%, transparent) 1px, transparent 1px); background-size: 110px 110px, 110px 110px, 22px 22px, 22px 22px; -webkit-mask-image: radial-gradient(100% 90% at 50% 0%, #000 10%, transparent 82%); mask-image: radial-gradient(100% 90% at 50% 0%, #000 10%, transparent 82%); }
.bgx-ledger { background-image: linear-gradient(90deg, transparent calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 25px), transparent calc(var(--side-w) + 25px)), repeating-linear-gradient(180deg, transparent 0 31px, color-mix(in srgb, var(--fg-dim) 28%, transparent) 31px 32px); }
.bgx-stripes { background: repeating-linear-gradient(135deg, transparent 0 16px, color-mix(in srgb, var(--fg-dim) 30%, transparent) 16px 17px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-lattice { background: repeating-linear-gradient(45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px), repeating-linear-gradient(-45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-scales { background-image: radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px), radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px); background-size: 28px 14px, 28px 14px; background-position: 0 0, 14px 7px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 88%); mask-image: linear-gradient(180deg, #000, transparent 88%); }

:focus-visible{outline:2px solid var(--fg-strong);outline-offset:2px}

/* ---- preview controls (not part of the look) ---- */
#pv{position:fixed;right:14px;bottom:14px;z-index:90;font:12px/1.35 system-ui,Segoe UI,sans-serif;background:var(--panel);color:var(--fg);border:1px solid var(--line);box-shadow:0 8px 24px -12px rgba(0,0,0,.5);max-width:260px}
#pv summary{cursor:pointer;padding:7px 10px;color:var(--fg-strong);font-weight:600;list-style:none}
#pv summary::-webkit-details-marker{display:none}
#pv .pvb{padding:4px 10px 10px;display:grid;gap:7px}
#pv label{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:6px;color:var(--fg-dim)}
#pv select{width:100%;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);padding:3px 4px}
#pv .seg{display:flex;gap:0}
#pv .seg button{flex:1;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);padding:3px 4px;cursor:pointer;margin-left:-1px}
#pv .seg button[aria-pressed="true"]{background:var(--fg-strong);color:var(--bg);border-color:var(--fg-strong)}
#pv .note{color:var(--fg-dim);font-size:11px}

/* ================= LOOK M: LAB BOOK ================= */
:root{--rule:30px;--base:15px;--marg:148px;--hand:color-mix(in srgb,var(--fg-strong) 72%,transparent)}
:root[data-density="compact"]{--rule:24px;--base:13.5px;--marg:124px}
:root{--side-w:calc(34px + var(--marg))} /* so the Ledger background's red margin line lands on the page margin */
body{font:var(--base)/var(--rule) "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
.desk{position:relative;z-index:1;padding:26px 18px 90px}
.book{display:grid;grid-template-columns:34px minmax(0,1fr) 58px;max-width:1060px;margin:0 auto;align-items:start}
.spine{align-self:stretch;min-height:calc(100vh - 120px);background:var(--panel-2);border:1px solid var(--line);border-right:0;
  background-image:radial-gradient(circle at 50% 50%,var(--bg) 0 5px,color-mix(in srgb,var(--fg-dim) 55%,transparent) 5px 6px,transparent 6.5px);
  background-size:34px calc(var(--rule)*3);background-position:0 calc(var(--rule)*1.5 - 1px);background-repeat:repeat-y}
.page{position:relative;background-color:var(--panel);border:1px solid var(--line);min-height:calc(100vh - 120px);padding:0 30px calc(var(--rule)*3) 0;
  background-image:repeating-linear-gradient(180deg,transparent 0 calc(var(--rule) - 1px),color-mix(in srgb,var(--line) 85%,transparent) calc(var(--rule) - 1px) var(--rule));
  background-position:0 0;box-shadow:0 1px 0 var(--line),0 14px 30px -26px rgba(0,0,0,.55)}
.page::before{content:"";position:absolute;top:0;bottom:0;left:var(--marg);width:1px;background:color-mix(in srgb,var(--alert) 50%,transparent);pointer-events:none}
.page>header{padding-top:calc(var(--rule)*1)}
.row{display:grid;grid-template-columns:var(--marg) minmax(0,1fr);min-height:var(--rule)}
.row>.m{padding-right:15px;text-align:right;font:12.5px/var(--rule) "IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--fg-dim);white-space:nowrap}
.row>.b{padding-left:20px}
.gap{height:var(--rule)}
h1{font:600 38px/calc(var(--rule)*2) "Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;letter-spacing:-.01em;margin:0;color:var(--fg-strong)}
h2{font:600 21px/var(--rule) "Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;color:var(--fg-strong);display:inline-block;border-bottom:2px solid color-mix(in srgb,var(--fg-strong) 60%,transparent);line-height:calc(var(--rule) - 2px)}
p{margin:0}
.lead{font-size:calc(var(--base) + 2px);color:var(--fg-strong)}
/* hand marks, plain CSS */
.wavy{text-decoration:underline wavy var(--alert);text-decoration-thickness:1.5px;text-underline-offset:5px}
.ring{white-space:nowrap;border:2px solid var(--hand);border-radius:52% 48% 56% 44% / 62% 48% 54% 46%;padding:0 .5em;margin:0 -.1em;box-decoration-break:clone;-webkit-box-decoration-break:clone;transform:rotate(-1deg)}
.under{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--hand)}
.box{display:inline-block;width:15px;height:15px;border:1.7px solid var(--hand);border-radius:2px;margin-right:11px;vertical-align:-2px;position:relative;transform:rotate(-2deg)}
.box.done::after{content:"";position:absolute;left:3px;top:-5px;width:6px;height:12px;border:solid var(--ok);border-width:0 3px 3px 0;transform:rotate(40deg)}
.done-t{color:var(--fg-dim);text-decoration:line-through;text-decoration-thickness:1.5px}
.id{font:12.5px "IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--fg-dim);margin-left:10px}
.due{color:var(--fg-dim);margin-left:12px}
.flag{display:inline-block;font:600 14px/1 "IBM Plex Sans",sans-serif;color:var(--fg-strong);border:1.7px solid var(--hand);border-radius:50%;width:18px;height:18px;text-align:center;line-height:15px;margin-left:10px;transform:rotate(4deg)}
/* pasted-in strips */
.strip{position:relative;margin:calc(var(--rule)/2) 6px calc(var(--rule)/2) 0;padding:calc(var(--rule)/2) 16px;background:var(--panel-2);border:1px solid var(--line);box-shadow:3px 4px 0 -1px color-mix(in srgb,var(--line) 70%,transparent),0 10px 18px -14px rgba(0,0,0,.5);transform:rotate(-.25deg)}
.strip::before,.strip::after{content:"";position:absolute;width:72px;height:22px;top:-12px;background:color-mix(in srgb,var(--attn) 22%,transparent);border:1px solid color-mix(in srgb,var(--attn) 28%,transparent);backdrop-filter:blur(1px)}
.strip::before{left:-14px;transform:rotate(-7deg)}
.strip::after{right:-12px;transform:rotate(6deg)}
.svc{display:grid;grid-template-columns:minmax(0,1.3fr) 112px minmax(0,1fr);align-items:baseline;min-height:var(--rule);border-bottom:1px dashed color-mix(in srgb,var(--line) 90%,transparent)}
.svc:last-child{border-bottom:0}
.svc .n{font:13px/var(--rule) "IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--fg-strong)}
.svc .s{font-weight:500}
.svc .x{color:var(--fg-dim);font-size:.93em}
.s-up{color:var(--ok)}.s-up::before{content:"";display:inline-block;width:5px;height:10px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(40deg);margin:0 9px 2px 3px}
.s-down{color:var(--alert)}.s-down b{font-weight:600;border:1.8px solid var(--alert);border-radius:50%;padding:0 .55em;display:inline-block;line-height:1.25;transform:rotate(-2deg)}
.s-degraded{color:var(--fg-strong)}.s-degraded span{text-decoration:underline wavy var(--attn);text-underline-offset:5px;text-decoration-thickness:1.5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week>div{padding:2px 8px 2px 8px;border-left:1px dashed var(--line);min-height:calc(var(--rule)*2)}
.week>div:first-child{border-left:0;padding-left:0}
.week .d{font:12.5px/var(--rule) "IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--fg-dim)}
.week .it{display:block;font-size:.93em;line-height:1.3;margin-bottom:4px;color:var(--fg)}
.week .today .d{color:var(--fg-strong);font-weight:500}
.week .today .d span{border:1.8px solid var(--hand);border-radius:50%;padding:1px 7px}
.log .t{color:var(--fg-dim)}
/* index tabs on the page edge */
.tabs{position:sticky;top:26px;display:flex;flex-direction:column;margin-left:-1px;padding-top:calc(var(--rule)*1.4)}
.tabs button{writing-mode:vertical-rl;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-left:0;border-radius:0 7px 7px 0;padding:14px 8px;margin:0 0 -1px 0;cursor:pointer;font:500 13px/1 "IBM Plex Sans",system-ui,sans-serif;text-align:left;min-height:84px;position:relative;left:0;transition:left .12s}
.tabs button:hover{color:var(--fg-strong)}
.tabs button[aria-current="page"]{background:var(--panel);color:var(--fg-strong);font-weight:600;left:-1px;padding-right:13px;border-color:var(--line);z-index:2;box-shadow:inset 0 -3px 0 -1px var(--fg-strong)}
.stub{color:var(--fg-dim)}
@media (max-width:760px){
 :root{--marg:84px}
 .desk{padding:12px 8px 90px}
 .book{grid-template-columns:18px minmax(0,1fr)}
 .tabs{grid-column:1/-1;grid-row:1;position:static;flex-direction:row;flex-wrap:wrap;gap:0;padding:0 0 8px 18px}
 .tabs button{writing-mode:horizontal-tb;min-height:0;padding:8px 10px;border-left:1px solid var(--line);border-radius:7px 7px 0 0;margin:0 -1px 0 0}
 .row>.b{padding-left:12px}.page{padding-right:12px}
 .week{grid-template-columns:repeat(2,minmax(0,1fr))}
 h1{font-size:30px}
}
</style>

var BGS = ["plain","glow","mesh","aurora","spotlight","horizon","dots","grid","blueprint","ledger","stripes","lattice","scales","beams","ripples","radar","contours","rays"];
var VARS = ["--bg","--panel","--panel-2","--line","--fg","--fg-strong","--fg-dim","--accent","--accent-ink","--accent-soft","--attn","--attn-soft"];
var STATUS = {
  light:{"--ok":"#17794d","--ok-soft":"rgba(23,121,77,.10)","--alert":"#bd3326","--alert-soft":"rgba(189,51,38,.09)","--info":"#1d63b8","--info-soft":"rgba(29,99,184,.09)"},
  dark:{"--ok":"#4cc38a","--ok-soft":"rgba(76,195,138,.12)","--alert":"#ff7b6e","--alert-soft":"rgba(255,123,110,.12)","--info":"#6aaaf0","--info-soft":"rgba(106,170,240,.13)"}
};
var LOOK_KEY = "look-preview-M";
var S = {theme:"stone",mode:"light",bg:"plain",bgs:"medium",density:"comfortable"};
try{var saved=JSON.parse(localStorage.getItem(LOOK_KEY)||"null"); if(saved){for(var k in saved){if(k in S)S[k]=saved[k];}}}catch(e){}
var Q={};try{new URLSearchParams(location.search).forEach(function(v,k){Q[k]=v})}catch(e){}
for(var qk in {theme:1,mode:1,bg:1,bgs:1,density:1}){if(Q[qk])S[qk]=Q[qk]}
var QVIEW=Q.view||"";
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applyLook(){
  var root=document.documentElement,t=THEMES.filter(function(x){return x.id===S.theme})[0]||THEMES[0];
  var vals=t[S.mode];
  VARS.forEach(function(v,i){root.style.setProperty(v,vals[i])});
  var st=STATUS[S.mode];for(var k in st)root.style.setProperty(k,st[k]);
  root.setAttribute("data-theme",S.mode);root.setAttribute("data-density",S.density);root.setAttribute("data-bg",S.bg);root.setAttribute("data-bgs",S.bgs);
  root.style.colorScheme=S.mode;
  var bg=$("#bg");if(bg)bg.className="bg bgx-"+S.bg;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(S))}catch(e){}
  $$("#pv [data-mode]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===S.mode))});
  $$("#pv [data-dens]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-dens")===S.density))});
  $$("#pv [data-bgs]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-bgs")===S.bgs))});
  if(window.onLookChange)window.onLookChange();
}
function buildControls(){
  var box=document.createElement("details");box.id="pv";box.open=window.innerWidth>760;
  var themeOpts=THEMES.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join("");
  var bgOpts=BGS.map(function(b){return '<option value="'+b+'">'+b.charAt(0).toUpperCase()+b.slice(1)+'</option>'}).join("");
  box.innerHTML='<summary>Preview controls</summary><div class="pvb">'
   +'<label>Theme<select id="pv-theme">'+themeOpts+'</select></label>'
   +'<label>Mode<span class="seg"><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button></span></label>'
   +'<label>Background<select id="pv-bg">'+bgOpts+'</select></label>'
   +'<label>Strength<span class="seg"><button type="button" data-bgs="subtle">Low</button><button type="button" data-bgs="medium">Mid</button><button type="button" data-bgs="strong">High</button></span></label>'
   +'<label>Density<span class="seg"><button type="button" data-dens="comfortable">Normal</button><button type="button" data-dens="compact">Compact</button></span></label>'
   +'<div class="note">All 18 themes and 18 backgrounds of the current site work in this look.</div></div>';
  document.body.appendChild(box);
  $("#pv-theme").value=S.theme;$("#pv-bg").value=S.bg;
  $("#pv-theme").addEventListener("change",function(e){S.theme=e.target.value;applyLook()});
  $("#pv-bg").addEventListener("change",function(e){S.bg=e.target.value;applyLook()});
  box.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-mode"))S.mode=b.getAttribute("data-mode");
    if(b.hasAttribute("data-dens"))S.density=b.getAttribute("data-dens");
    if(b.hasAttribute("data-bgs"))S.bgs=b.getAttribute("data-bgs");
    applyLook();});
}



var VIEWS=[["overview","Overview"],["ops","Ops board"],["monitoring","Monitoring"],["calendar","Calendar"],["projects","Projects"],["vuln","Vulnerabilities"]];
var view=QVIEW||"overview";
function row(m,b,cls){return '<div class="row'+(cls?' '+cls:'')+'"><div class="m">'+(m||"")+'</div><div class="b">'+(b||"")+'</div></div>'}
function overview(){
  var w=DATA.waiting_on_you, open=w.filter(function(x){return x.lane!=="done"}), done=w.filter(function(x){return x.lane==="done"});
  var h='<header>'+row("22:51",'<h1>Tuesday 24 November</h1>')+'</header>';
  h+=row("",'<p class="lead">'+open.length+' items are open for you. <span class="wavy">APP-02 has not answered for 14 minutes</span>, and the backup restore test is <span class="ring">5 days overdue</span>.</p>');
  h+='<div class="gap"></div>';
  h+=row(open.length+' open','<h2>Open items</h2>');
  function item(x){var od=x.kind==="overdue";return row(esc(x.age),'<span class="box"></span>'+esc(x.title)+(x.due?'<span class="due">due '+(od?'<span class="ring">'+esc(x.due)+'</span>':esc(x.due))+'</span>':'')+(od?'<span class="flag" title="overdue">!</span>':''))}
  open.forEach(function(x){h+=item(x)});
  done.forEach(function(x){h+=row(esc(x.age),'<span class="box done"></span><span class="done-t">'+esc(x.title)+'</span>')});
  h+='<div class="gap"></div>';
  h+=row("22:51",'<h2>Systems</h2>');
  var svc='<div class="strip" role="table" aria-label="Systems">';
  DATA.services.forEach(function(s){
    var st=s.state==="up"?'<span class="s s-up">up</span>':s.state==="down"?'<span class="s s-down"><b>down</b></span>':'<span class="s s-degraded"><span>degraded</span></span>';
    svc+='<div class="svc" role="row"><span class="n" role="cell">'+esc(s.name)+'</span>'+st+'<span class="x" role="cell">'+esc(s.note)+'</span></div>';
  });
  svc+='</div>';
  h+=row("",svc);
  h+=row(DATA.in_progress.length+" running",'<h2>Running</h2>');
  DATA.in_progress.forEach(function(p){h+=row(esc(p.who),esc(p.title)+'<span class="due">'+esc(p.progress)+'</span>')});
  h+='<div class="gap"></div>';
  h+=row("since 09:00",'<h2>Log</h2>');
  DATA.since_last_looked.forEach(function(e){h+=row(esc(e.t),esc(e.text),"log")});
  h+='<div class="gap"></div>';
  h+=row("next 7 days",'<h2>Week ahead</h2>');
  var wk='<div class="strip"><div class="week">';
  DATA.week.forEach(function(d,i){wk+='<div'+(i===0?' class="today"':'')+'><div class="d">'+(i===0?'<span>'+d.day+'</span>':d.day)+'</div>'+(d.items.length?d.items.map(function(t){return '<span class="it">'+esc(t)+'</span>'}).join(""):'<span class="it" style="color:var(--fg-dim)">free</span>')+'</div>'});
  wk+='</div></div>';
  h+=row("",wk);
  return h;
}
function ops(){
  var rows=DATA.second_view_ops_rows;
  var lanes=[["needs you","For you"],["in progress","Running"],["backlog","Backlog"]];
  var h='<header>'+row("40 items",'<h1>Open items</h1>')+'</header>';
  h+=row("",'<p class="lead">4 for you, 3 running, 6 soaking, 27 in the backlog. Oldest first inside each group.</p>');
  h+='<div class="gap"></div>';
  lanes.forEach(function(L){
    var rs=rows.filter(function(r){return r[2]===L[0]});
    h+=row(rs.length+" shown",'<h2>'+L[1]+'</h2>');
    rs.forEach(function(r){var od=r[3]==="19 Nov";
      var mark=L[0]==="needs you"?'<span class="box"></span>':L[0]==="in progress"?'<span class="box" style="background:linear-gradient(90deg,var(--hand) 50%,transparent 50%)"></span>':'<span class="box" style="border-style:dashed"></span>';
      h+=row(esc(r[3]),mark+esc(r[1])+'<span class="id">'+esc(r[0])+'</span>'+(od?'<span class="flag">!</span>':''));
    });
    h+='<div class="gap"></div>';
  });
  h+=row("",'<p class="stub">Soaking items (6) are folded away. Open them with the page tab on the right.</p>');
  return h;
}
function stub(name){return '<header>'+row("",'<h1>'+esc(name)+'</h1>')+'</header>'+row("",'<p class="stub">This page is not drawn in the mock-up. It would use the same page, margin and strip pattern as Overview and Open items.</p>')}
function render(){
  var page=$("#page");
  page.innerHTML=view==="overview"?overview():view==="ops"?ops():stub((VIEWS.filter(function(v){return v[0]===view})[0]||[0,""])[1]);
  $("#tabs").innerHTML=VIEWS.map(function(v){return '<button type="button" data-v="'+v[0]+'"'+(v[0]===view?' aria-current="page"':'')+'>'+v[1]+'</button>'}).join("");
}
$("#tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.getAttribute("data-v");render();window.scrollTo(0,0)});
buildControls();applyLook();render();
</script>
