*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);}
button,select,input{font:inherit;color:inherit}
:root{
--bg:#0b1016;--panel:#121920;--panel-2:#172029;--line:#232e3a;--fg:#ced7e0;--fg-strong:#f2f5f8;--fg-dim:#8c99a7;
--accent:#e8a33d;--accent-ink:#1b1304;--accent-soft:rgba(232,163,61,.12);--attn:#a891ff;--attn-soft:rgba(168,145,255,.12);
--ok:#4cc38a;--ok-soft:rgba(76,195,138,.12);--alert:#ff7b6e;--alert-soft:rgba(255,123,110,.12);--info:#6aaaf0;--info-soft:rgba(106,170,240,.13);
--side-w:0px;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
:root[data-bgs="subtle"] .bg{opacity:.5}:root[data-bgs="medium"] .bg{opacity:.85}:root[data-bgs="strong"] .bg{opacity:1}
.bgx-glow { background: radial-gradient(60% 55% at 88% -8%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 72%), radial-gradient(50% 45% at -6% 104%, color-mix(in srgb, var(--attn) 34%, transparent), transparent 70%); }
.bgx-mesh { background: radial-gradient(40% 40% at 12% 18%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 70%), radial-gradient(38% 40% at 86% 22%, color-mix(in srgb, var(--attn) 32%, transparent), transparent 70%), radial-gradient(44% 44% at 70% 92%, color-mix(in srgb, var(--info) 32%, transparent), transparent 70%), radial-gradient(36% 36% at 6% 86%, color-mix(in srgb, var(--ok) 24%, transparent), transparent 70%); }
.bgx-aurora { background: linear-gradient(112deg, transparent 12%, color-mix(in srgb, var(--accent) 34%, transparent) 34%, color-mix(in srgb, var(--attn) 32%, transparent) 50%, color-mix(in srgb, var(--info) 30%, transparent) 66%, transparent 88%), radial-gradient(60% 50% at 20% 100%, color-mix(in srgb, var(--attn) 20%, transparent), transparent 70%); background-size: 160% 70%, 100% 100%; background-repeat: no-repeat; background-position: 30% 0, 0 0; -webkit-mask-image: linear-gradient(180deg, #000 20%, transparent 95%); mask-image: linear-gradient(180deg, #000 20%, transparent 95%); }
.bgx-spotlight { background: radial-gradient(34% 42% at 50% -6%, color-mix(in srgb, var(--fg-strong) 22%, transparent), transparent 72%), radial-gradient(80% 62% at 50% -12%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 74%); }
.bgx-horizon { background: linear-gradient(180deg, transparent 30%, color-mix(in srgb, var(--accent) 26%, transparent) 75%, color-mix(in srgb, var(--attn) 38%, transparent) 100%), repeating-linear-gradient(180deg, transparent 0 22px, color-mix(in srgb, var(--accent) 12%, transparent) 22px 23px); }
.bgx-dots { background-image: radial-gradient(color-mix(in srgb, var(--fg-dim) 60%, transparent) 1.2px, transparent 1.6px); background-size: 24px 24px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); }
.bgx-grid { background-image: linear-gradient(color-mix(in srgb, var(--fg-dim) 38%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--fg-dim) 38%, transparent) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(90% 80% at 50% 0%, #000 10%, transparent 80%); mask-image: radial-gradient(90% 80% at 50% 0%, #000 10%, transparent 80%); }
.bgx-blueprint { background-image: linear-gradient(color-mix(in srgb, var(--info) 40%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--info) 40%, transparent) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--info) 18%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--info) 18%, transparent) 1px, transparent 1px); background-size: 110px 110px, 110px 110px, 22px 22px, 22px 22px; -webkit-mask-image: radial-gradient(100% 90% at 50% 0%, #000 10%, transparent 82%); mask-image: radial-gradient(100% 90% at 50% 0%, #000 10%, transparent 82%); }
.bgx-ledger { background-image: linear-gradient(90deg, transparent calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 25px), transparent calc(var(--side-w) + 25px)), repeating-linear-gradient(180deg, transparent 0 31px, color-mix(in srgb, var(--fg-dim) 28%, transparent) 31px 32px); }
.bgx-stripes { background: repeating-linear-gradient(135deg, transparent 0 16px, color-mix(in srgb, var(--fg-dim) 30%, transparent) 16px 17px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-lattice { background: repeating-linear-gradient(45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px), repeating-linear-gradient(-45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-scales { background-image: radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px), radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px); background-size: 28px 14px, 28px 14px; background-position: 0 0, 14px 7px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 88%); mask-image: linear-gradient(180deg, #000, transparent 88%); }

var BGS = ["plain","glow","mesh","aurora","spotlight","horizon","dots","grid","blueprint","ledger","stripes","lattice","scales","beams","ripples","radar","contours","rays"];
var VARS = ["--bg","--panel","--panel-2","--line","--fg","--fg-strong","--fg-dim","--accent","--accent-ink","--accent-soft","--attn","--attn-soft"];
var STATUS = {
  light:{"--ok":"#17794d","--ok-soft":"rgba(23,121,77,.10)","--alert":"#bd3326","--alert-soft":"rgba(189,51,38,.09)","--info":"#1d63b8","--info-soft":"rgba(29,99,184,.09)"},

var LOOK_KEY = "look-preview-O";
var S = {theme:"azure",mode:"light",bg:"plain",bgs:"medium",density:"comfortable"};
try{var saved=JSON.parse(localStorage.getItem(LOOK_KEY)||"null"); if(saved){for(var k in saved){if(k in S)S[k]=saved[k];}}}catch(e){}
var Q={};try{new URLSearchParams(location.search).forEach(function(v,k){Q[k]=v})}catch(e){}
for(var qk in {theme:1,mode:1,bg:1,bgs:1,density:1}){if(Q[qk])S[qk]=Q[qk]}
var QVIEW=Q.view||"";
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function applyLook(){
  var root=document.documentElement,t=THEMES.filter(function(x){return x.id===S.theme})[0]||THEMES[0];
  var vals=t[S.mode];
  VARS.forEach(function(v,i){root.style.setProperty(v,vals[i])});
  var st=STATUS[S.mode];for(var k in st)root.style.setProperty(k,st[k]);
  root.setAttribute("data-theme",S.mode);root.setAttribute("data-density",S.density);root.setAttribute("data-bg",S.bg);root.setAttribute("data-bgs",S.bgs);
  root.style.colorScheme=S.mode;
  var bg=$("#bg");if(bg)bg.className="bg bgx-"+S.bg;
  try{localStorage.setItem(LOOK_KEY,JSON.stringify(S))}catch(e){}
  $$("#pv [data-mode]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===S.mode))});
  $$("#pv [data-dens]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-dens")===S.density))});
  $$("#pv [data-bgs]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-bgs")===S.bgs))});
  if(window.onLookChange)window.onLookChange();
}
function buildControls(){
  var box=document.createElement("details");box.id="pv";box.open=window.innerWidth>760;
  var themeOpts=THEMES.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join("");
  var bgOpts=BGS.map(function(b){return '<option value="'+b+'">'+b.charAt(0).toUpperCase()+b.slice(1)+'</option>'}).join("");
  box.innerHTML='<summary>Preview controls</summary><div class="pvb">'
   +'<label>Theme<select id="pv-theme">'+themeOpts+'</select></label>'
   +'<label>Mode<span class="seg"><button type="button" data-mode="light">Light</button><button type="button" data-mode="dark">Dark</button></span></label>'
   +'<label>Background<select id="pv-bg">'+bgOpts+'</select></label>'
   +'<label>Strength<span class="seg"><button type="button" data-bgs="subtle">Low</button><button type="button" data-bgs="medium">Mid</button><button type="button" data-bgs="strong">High</button></span></label>'
   +'<label>Density<span class="seg"><button type="button" data-dens="comfortable">Normal</button><button type="button" data-dens="compact">Compact</button></span></label>'
   +'<div class="note">All 18 themes and 18 backgrounds of the current site work in this look.</div></div>';
  document.body.appendChild(box);
  $("#pv-theme").value=S.theme;$("#pv-bg").value=S.bg;
  $("#pv-theme").addEventListener("change",function(e){S.theme=e.target.value;applyLook()});
  $("#pv-bg").addEventListener("change",function(e){S.bg=e.target.value;applyLook()});
  box.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-mode"))S.mode=b.getAttribute("data-mode");
    if(b.hasAttribute("data-dens"))S.density=b.getAttribute("data-dens");
    if(b.hasAttribute("data-bgs"))S.bgs=b.getAttribute("data-bgs");
    applyLook();});
}



var GROUPS=[["Today",[["overview","Overview"]]],["Work",[["ops","Ops board"],["projects","Projects"],["calendar","Calendar"]]],["Systems",[["monitoring","Monitoring"],["vuln","Vulnerabilities"]]]];
var view=QVIEW||"overview",filter="";
function bd(t,cls){return '<span class="bd '+(cls||"")+'">'+esc(t)+'</span>'}
function nameOf(v){var n="";GROUPS.forEach(function(g){g[1].forEach(function(p){if(p[0]===v)n=p[1]})});return n}
function tree(){
  var h="";GROUPS.forEach(function(g){var items=g[1].filter(function(p){return !filter||p[1].toLowerCase().indexOf(filter)!==-1});if(!items.length)return;
    h+='<h2>'+g[0]+'</h2><ul>'+items.map(function(p){return '<li><button type="button" data-v="'+p[0]+'"'+(p[0]===view?' aria-current="page"':'')+'>'+p[1]+'</button></li>'}).join("")+'</ul>'});
  if(!h)h='<p class="none">No page matches "'+esc(filter)+'".</p>';
  $("#tree").innerHTML=h;
}
function head(name,sub){return '<p class="crumb"><button type="button" data-v="overview">Barnyard</button> / '+esc(name)+'</p><h1>'+esc(name)+'</h1><p class="mt">'+sub+'</p>'}
function foot(){return '<div class="foot"><button type="button">Edit this page</button><button type="button">History (4 versions)</button>Last edit 22:51 by Claude.</div>'}
function sec(id,title,body){return '<h2 id="'+id+'">'+esc(title)+'<a href="#'+id+'" aria-label="Link to this section">#</a></h2>'+body}
function overview(){
  var open=DATA.waiting_on_you.filter(function(x){return x.lane!=="done"}),done=DATA.waiting_on_you.filter(function(x){return x.lane==="done"});
  var h=head("Overview","Updated Tuesday 24 November, 22:51. Owner: Alex.");
  h+='<p>'+bd(open.length+" items","bd-warn")+' need a decision from you today. <b>APP-02</b> is '+bd("down","bd-alert")+' and has not replied for 14 minutes. One backup check is '+bd("overdue","bd-alert")+'. Everything else is running.</p>';
  h+=sec("decisions","Decisions you owe",'<ul class="tasks">'+open.map(function(x){return '<li><span class="cb"></span><span class="tx">'+esc(x.title)+' '+(x.due?bd("due "+x.due,x.kind==="overdue"?"bd-alert":""):"")+' <span class="id">'+esc(x.id)+'</span> <span style="color:var(--fg-dim)">open '+esc(x.age)+'</span></span></li>'}).join("")+done.map(function(x){return '<li class="done"><span class="cb"></span><span class="tx">'+esc(x.title)+'</span></li>'}).join("")+'</ul>');

  h+=sec("progress","Work in progress",'<ul class="t">'+DATA.in_progress.map(function(p){return '<li>'+esc(p.title)+' ('+esc(p.who)+'): '+esc(p.progress)+'</li>'}).join("")+'</ul>');
  h+=sec("changes","What changed today",'<dl class="log">'+DATA.since_last_looked.map(function(e){return '<dt>'+esc(e.t)+'</dt><dd>'+esc(e.text)+'</dd>'}).join("")+'</dl>');
  h+=sec("week","Next seven days",'<ul class="t">'+DATA.week.filter(function(d){return d.items.length}).map(function(d){return '<li><b>'+d.day+'</b>: '+d.items.map(esc).join("; ")+'</li>'}).join("")+'</ul><p style="color:var(--fg-dim)">Friday and Saturday are free.</p>');
  return h+foot();
}

function stub(){var n=nameOf(view);return head(n,"Not drawn in the mock-up.")+'<p>This page would follow the same pattern: a short summary sentence with inline status, then sections in a table or list. See <button type="button" data-v="ops" style="background:none;border:0;padding:0;color:var(--fg-strong);text-decoration:underline;cursor:pointer;font:inherit">Ops board</button>.</p>'+foot()}
var io=null;
function toc(){
  var hs=$$("#art h2");var h='<h2>On this page</h2><ul>'+hs.map(function(x){return '<li><a href="#'+x.id+'" data-t="'+x.id+'">'+esc(x.firstChild.textContent)+'</a></li>'}).join("")+'</ul>';
  $("#toc").innerHTML=hs.length?h:"";
  if(io)io.disconnect();
  if(!hs.length||!window.IntersectionObserver)return;
  io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){$$("#toc a").forEach(function(a){a.classList.toggle("cur",a.getAttribute("data-t")===e.target.id)})}})},{rootMargin:"0px 0px -70% 0px"});
  hs.forEach(function(x){io.observe(x)});
  var first=$("#toc a");if(first)first.classList.add("cur");
}
function render(){tree();$("#art").innerHTML=view==="overview"?overview():view==="ops"?ops():stub();toc()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-v]");if(!b)return;view=b.getAttribute("data-v");render();window.scrollTo(0,0)});
$("#srch").addEventListener("input",function(e){filter=e.target.value.trim().toLowerCase();tree()});
$("#toc").addEventListener("click",function(e){var a=e.target.closest("a[data-t]");if(!a)return;e.preventDefault();var t=document.getElementById(a.getAttribute("data-t"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
buildControls();applyLook();render();
