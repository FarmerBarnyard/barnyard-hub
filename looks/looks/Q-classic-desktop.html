<style>

.bgx-horizon { background: linear-gradient(180deg, transparent 30%, color-mix(in srgb, var(--accent) 26%, transparent) 75%, color-mix(in srgb, var(--attn) 38%, transparent) 100%), repeating-linear-gradient(180deg, transparent 0 22px, color-mix(in srgb, var(--accent) 12%, transparent) 22px 23px); }
.bgx-dots { background-image: radial-gradient(color-mix(in srgb, var(--fg-dim) 60%, transparent) 1.2px, transparent 1.6px); background-size: 24px 24px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 85%); mask-image: linear-gradient(180deg, #000, transparent 85%); }

.bgx-ledger { background-image: linear-gradient(90deg, transparent calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 24px), color-mix(in srgb, var(--alert) 46%, transparent) calc(var(--side-w) + 25px), transparent calc(var(--side-w) + 25px)), repeating-linear-gradient(180deg, transparent 0 31px, color-mix(in srgb, var(--fg-dim) 28%, transparent) 31px 32px); }
.bgx-stripes { background: repeating-linear-gradient(135deg, transparent 0 16px, color-mix(in srgb, var(--fg-dim) 30%, transparent) 16px 17px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-lattice { background: repeating-linear-gradient(45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px), repeating-linear-gradient(-45deg, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 26%, transparent) 13px 14px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 90%); mask-image: linear-gradient(180deg, #000, transparent 90%); }
.bgx-scales { background-image: radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px), radial-gradient(circle at 50% 100%, transparent 0 13px, color-mix(in srgb, var(--fg-dim) 36%, transparent) 13px 14px, transparent 14px); background-size: 28px 14px, 28px 14px; background-position: 0 0, 14px 7px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 88%); mask-image: linear-gradient(180deg, #000, transparent 88%); }
.bgx-beams { background: repeating-linear-gradient(90deg, transparent 0 22px, color-mix(in srgb, var(--accent) 34%, transparent) 22px 24px, transparent 24px 41px, color-mix(in srgb, var(--attn) 28%, transparent) 41px 42px, transparent 42px 64px); -webkit-mask-image: linear-gradient(180deg, #000, transparent 82%); mask-image: linear-gradient(180deg, #000, transparent 82%); }
.bgx-ripples { background: repeating-radial-gradient(circle at 92% -6%, transparent 0 38px, color-mix(in srgb, var(--accent) 40%, transparent) 38px 39px), repeating-radial-gradient(circle at -4% 104%, transparent 0 46px, color-mix(in srgb, var(--attn) 34%, transparent) 46px 47px); -webkit-mask-image: linear-gradient(180deg, #000 30%, rgba(0,0,0,.35)); mask-image: linear-gradient(180deg, #000 30%, rgba(0,0,0,.35)); }

.bgx-contours { background: repeating-radial-gradient(ellipse 70% 45% at 18% 28%, transparent 0 24px, color-mix(in srgb, var(--accent) 34%, transparent) 24px 25px), repeating-radial-gradient(ellipse 50% 75% at 86% 78%, transparent 0 28px, color-mix(in srgb, var(--attn) 32%, transparent) 28px 29px), repeating-radial-gradient(ellipse 40% 30% at 62% 8%, transparent 0 30px, color-mix(in srgb, var(--info) 24%, transparent) 30px 31px); }
.bgx-rays { background: repeating-conic-gradient(from 180deg at 100% 0%, color-mix(in srgb, var(--accent) 30%, transparent) 0 3deg, transparent 3deg 9deg); -webkit-mask-image: radial-gradient(85% 95% at 100% 0%, #000 5%, transparent 78%); mask-image: radial-gradient(85% 95% at 100% 0%, #000 5%, transparent 78%); }
* { box-sizing: border-box; }
:root {
  --face: color-mix(in srgb, var(--line) 78%, var(--panel));
  --hi: #ffffff; --hi2: color-mix(in srgb, var(--face) 55%, #ffffff);
  --sh: color-mix(in srgb, var(--fg-dim) 55%, var(--face)); --dk: color-mix(in srgb, #000000 62%, var(--face));
  --ui: Tahoma, "Segoe UI", Verdana, Geneva, sans-serif; --mono: "Lucida Console", "Courier New", monospace;
}
:root[data-theme="dark"] {
  --hi: color-mix(in srgb, #ffffff 26%, var(--face)); --hi2: color-mix(in srgb, #ffffff 11%, var(--face));
  --sh: color-mix(in srgb, #000000 36%, var(--face)); --dk: #000000;
}
html { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 14px/1.35 var(--ui); background: transparent; color: var(--fg); }
html[data-density="compact"] body { font-size: 13px; line-height: 1.25; }
#desk { position: relative; z-index: 1; padding: 14px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.raised { background: var(--face); box-shadow: inset -1px -1px 0 var(--dk), inset 1px 1px 0 var(--hi), inset -2px -2px 0 var(--sh), inset 2px 2px 0 var(--hi2); }
.sunken { background: var(--panel); color: var(--fg-strong); box-shadow: inset 1px 1px 0 var(--sh), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--dk), inset -2px -2px 0 var(--hi2); }
.win { padding: 3px; width: min(1100px, 100%); color: var(--fg-strong); }
.win.dialog { width: min(560px, 100%); margin-left: 60px; }
@media (max-width: 700px) { .win.dialog { margin-left: 0; } #desk { padding: 6px; } .body { flex-direction: column; } .tree { width: auto; max-height: 150px; } .titlebar .t { font-size: 12px; } .toolbar button { min-width: 0; padding: 3px 8px; } }
.titlebar { display: flex; align-items: center; gap: 6px; height: 24px; padding: 2px 3px 2px 6px; background: var(--accent); color: var(--accent-ink); font-weight: bold; }
.win.inactive > .titlebar { background: var(--fg-dim); color: var(--panel); }
.titlebar .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar .cb { width: 18px; height: 16px; font: bold 11px/1 var(--ui); color: var(--fg-strong); padding: 0; text-align: center; }
.menubar { display: flex; gap: 0; padding: 1px 2px; position: relative; border-bottom: 1px solid var(--sh); box-shadow: 0 1px 0 var(--hi); }
.mi { position: relative; }
.menubar button.m, .toolbar button, .tabs button, .dd button, button.btn { font: inherit; color: var(--fg-strong); background: transparent; border: 0; padding: 2px 9px; cursor: default; }
.menubar button.m[aria-expanded="true"], .menubar button.m:hover { background: var(--accent); color: var(--accent-ink); }
.dd { position: absolute; left: 0; top: 100%; min-width: 230px; padding: 2px; z-index: 20; display: none; }
.dd.open { display: block; }
.dd button { display: block; width: 100%; text-align: left; padding: 3px 16px 3px 22px; white-space: nowrap; }
.dd button:hover, .dd button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: 0; }
.dd hr { border: 0; border-top: 1px solid var(--sh); border-bottom: 1px solid var(--hi); margin: 3px 2px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 3px; border-bottom: 1px solid var(--sh); box-shadow: 0 1px 0 var(--hi); }
.toolbar button, button.btn { background: var(--face); box-shadow: inset -1px -1px 0 var(--dk), inset 1px 1px 0 var(--hi), inset -2px -2px 0 var(--sh), inset 2px 2px 0 var(--hi2); padding: 3px 12px; min-width: 64px; }
.toolbar button:active, button.btn:active, .toolbar button.on { box-shadow: inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--sh), inset -2px -2px 0 var(--hi2); padding: 4px 11px 2px 13px; }
.toolbar .sep { width: 2px; height: 20px; margin: 0 3px; border-left: 1px solid var(--sh); border-right: 1px solid var(--hi); }
.tabs { display: flex; gap: 0; padding: 6px 6px 0; }
.tabs button { background: var(--face); padding: 3px 14px; margin-right: 2px; box-shadow: inset 1px 1px 0 var(--hi), inset -1px 0 0 var(--dk), inset 2px 2px 0 var(--hi2), inset -2px 0 0 var(--sh); position: relative; top: 1px; }
.tabs button[aria-selected="true"] { padding-top: 5px; margin-top: -2px; top: 1px; z-index: 2; font-weight: bold; }
.tabs button:not([aria-selected="true"]) { top: 2px; }
.body { display: flex; gap: 6px; padding: 6px; min-height: 340px; box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--dk), inset -2px -2px 0 var(--sh); margin: 0 4px; }
html[data-tree="hidden"] .tree { display: none; }
.tree { width: 190px; flex: none; padding: 6px 4px; overflow: auto; font-size: 1em; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul ul { padding-left: 16px; }
.tree .g { font-family: var(--mono); font-size: .9em; margin-right: 4px; }
.tree button { font: inherit; color: var(--fg-strong); background: transparent; border: 0; padding: 1px 4px; text-align: left; cursor: default; width: 100%; }
.tree button[aria-current="page"], .tree button.sel { background: var(--accent); color: var(--accent-ink); }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 2px; overflow: auto; }
fieldset { margin: 6px 0 2px; padding: 8px 10px 8px; border: 1px solid var(--sh); box-shadow: 1px 1px 0 var(--hi), inset 1px 1px 0 var(--hi); min-width: 0; }
legend { padding: 0 4px; color: var(--fg-strong); font-weight: bold; }
.list { width: 100%; border-collapse: separate; border-spacing: 0; }
.list th { background: var(--face); color: var(--fg-strong); font-weight: normal; text-align: left; padding: 2px 8px; box-shadow: inset -1px -1px 0 var(--dk), inset 1px 1px 0 var(--hi), inset -2px -2px 0 var(--sh), inset 2px 2px 0 var(--hi2); white-space: nowrap; }
.list td { padding: 2px 8px; border-bottom: 1px dotted var(--fg-dim); vertical-align: top; }
html[data-density="compact"] .list td { padding: 0 8px; }
.list tr.row { cursor: default; }
.list tr.row.sel td { background: var(--accent); color: var(--accent-ink); border-bottom-color: var(--accent); }
.list tr.done td { text-decoration: line-through; }
.fieldwrap { padding: 2px; overflow: auto; }
.lamp { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--dk); box-shadow: inset 1px 1px 0 var(--hi); }
.lamp.up { background: var(--ok); } .lamp.down { background: var(--alert); } .lamp.degraded { background: var(--attn); }
.id { font-family: var(--mono); font-size: .92em; }
.statusbar { display: flex; gap: 3px; padding: 3px 4px 2px; }
.statusbar .cell { padding: 2px 8px; box-shadow: inset 1px 1px 0 var(--sh), inset -1px -1px 0 var(--hi); color: var(--fg-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statusbar .cell.grow { flex: 1; }
.det { padding: 6px 8px; min-height: 3.2em; }
.row2 { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; margin: 3px 0; }
.row2 label { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-strong); }
select { font: inherit; color: var(--fg-strong); background: var(--panel); border: 0; padding: 2px 4px; box-shadow: inset 1px 1px 0 var(--sh), inset -1px -1px 0 var(--hi), inset 2px 2px 0 var(--dk), inset -2px -2px 0 var(--hi2); min-width: 9em; }
input[type="radio"], input[type="checkbox"] { accent-color: var(--accent); }
button:focus-visible, select:focus-visible, input:focus-visible, tr.row:focus-visible { outline: 2px dotted var(--fg-strong); outline-offset: -4px; }
.tabs button:focus-visible, .tree button:focus-visible { outline-offset: -3px; }
.hidden { display: none !important; }
.note { margin: 2px 0; color: var(--fg-strong); }
</style>

<body>
<div class="bg bgx-plain" id="bg" aria-hidden="true"></div>
<div id="desk">

  <div class="win raised" id="mainwin" role="application" aria-label="Barnyard window">
    <div class="titlebar"><span class="t" id="wtitle">Barnyard - Overview</span><span class="cb raised" aria-hidden="true">_</span><span class="cb raised" aria-hidden="true">[ ]</span><span class="cb raised" aria-hidden="true">x</span></div>
    <div class="menubar" role="menubar" id="menubar">

      <div class="mi"><button type="button" class="m" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="view">View</button>
        <div class="dd raised" role="menu" id="m-view"><button type="button" role="menuitem" data-act="v-overview" id="mv-ov">Overview</button><button type="button" role="menuitem" data-act="v-ops" id="mv-ops">Ops board</button><hr><button type="button" role="menuitem" data-act="tree" id="mv-tree">[x] Tree pane</button></div></div>

      <div class="mi"><button type="button" class="m" role="menuitem" aria-haspopup="true" aria-expanded="false" data-menu="help">Help</button>

    </div>
    <div class="toolbar" role="toolbar" aria-label="Actions">
      <button type="button" data-act="refresh">Refresh</button>
      <button type="button" data-act="open">Open</button>
      <button type="button" data-act="mark">Mark done</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-act="v-ops">Ops board</button>
      <button type="button" data-act="settings">Display...</button>

  </div>

    <div style="padding:8px 10px 10px">
      <fieldset><legend>Colour scheme</legend>
        <div class="row2"><label>Scheme <select data-ctl="theme"></select></label>
          <label><input type="radio" name="qmode" value="light" data-ctl="mode"> Light</label>
          <label><input type="radio" name="qmode" value="dark" data-ctl="mode"> Dark</label></div></fieldset>
      <fieldset><legend>Desktop pattern</legend>
        <div class="row2"><label>Pattern <select data-ctl="bg"></select></label>
          <label>Strength <select data-ctl="bgs"><option value="subtle">subtle</option><option value="medium">medium</option><option value="strong">strong</option></select></label></div></fieldset>

      <div style="text-align:right;margin-top:6px"><button type="button" class="btn" data-act="close-settings">Close</button></div>
    </div>
  </div>

</div>
<script>

    d.second_view_ops_rows.forEach(function (r) { h += '<tr class="row' + (sel === r[0] ? " sel" : "") + (done[r[0]] ? " done" : "") + '" tabindex="0" data-id="' + r[0] + '" aria-selected="' + (sel === r[0]) + '"><td class="id">' + r[0] + '</td><td>' + esc(r[1]) + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td></tr>'; });
    h += '</tbody></table></div></fieldset>';
    var cur = d.second_view_ops_rows.filter(function (r) { return r[0] === sel; })[0];
    h += '<fieldset><legend>Details</legend><div class="det sunken">' + (cur ? '<strong>' + esc(cur[1]) + '</strong><br>' + cur[0] + ", lane: " + cur[2] + ", due: " + cur[3] + (done[cur[0]] ? ". Marked done." : ".") : "Select an item.") + '</div></fieldset>';
    return h;
  }
  function tree(s, d) {
    var cnt = {}; d.ops_board.forEach(function (l) { cnt[l.lane] = l.n; });
    function b(label, extra, attrs) { return '<li><button type="button" ' + (attrs || "") + '>' + label + (extra || "") + '</button></li>'; }
    var h = '<ul><li><span class="g">[-]</span>Barnyard<ul>';
    h += b("Overview", "", 'data-act="v-overview"' + (s.view === "overview" ? ' aria-current="page"' : ""));
    h += b("Ops board", "", 'data-act="v-ops"' + (s.view === "ops" ? ' aria-current="page"' : ""));
    ["Monitoring", "Calendar", "Projects", "Vulnerabilities"].forEach(function (n) { h += b(n, "", 'data-act="stub" data-label="' + n + '"'); });
    h += '</ul></li><li><span class="g">[-]</span>Lanes<ul>';
    d.ops_board.forEach(function (l) { h += b(l.lane, " (" + l.n + ")", 'data-act="v-ops"'); });
    return h + '</ul></li></ul>';
  }
  function status(s, d) {
    var nd = needs(d).filter(function (x) { return !done[x.id]; }).length, down = d.services.filter(function (x) { return x.state === "down"; }).length;
    document.getElementById("st-msg").textContent = msg;
    document.getElementById("st-a").textContent = nd + " need you";
    document.getElementById("st-b").textContent = down + " service down";
  }
  function menuChecks(s) {
    function set(id, t) { var e = document.getElementById(id); if (e) e.textContent = t; }
    set("mv-tree", (s.tree === "full" ? "[x]" : "[ ]") + " Tree pane");
    set("md-light", (s.mode === "light" ? "(o)" : "( )") + " Light"); set("md-dark", (s.mode === "dark" ? "(o)" : "( )") + " Dark");
    set("md-dens", (s.density === "compact" ? "[x]" : "[ ]") + " Compact rows");
    set("mv-ov", (s.view === "overview" ? "(o)" : "( )") + " Overview"); set("mv-ops", (s.view === "ops" ? "(o)" : "( )") + " Ops board");
  }
  window.LOOK_RENDER = function (s, d) {
    var ov = s.view !== "ops";
    document.getElementById("view").innerHTML = ov ? overview(d) : ops(d);
    document.getElementById("tree").innerHTML = tree(s, d);
    document.getElementById("wtitle").textContent = "Barnyard - " + (ov ? "Overview" : "Ops board");
    document.title = "Barnyard - " + (ov ? "Overview" : "Ops board") + " - look Q (Classic Desktop)";
    document.getElementById("tab-ov").setAttribute("aria-selected", ov); document.getElementById("tab-ops").setAttribute("aria-selected", !ov);
    document.getElementById("dlg").classList.toggle("hidden", !dlgOpen);
    menuChecks(s); status(s, d);
  };
  function closeMenus() { var m = document.querySelectorAll(".dd.open"); for (var i = 0; i < m.length; i++) m[i].classList.remove("open"); var b = document.querySelectorAll("[data-menu]"); for (var j = 0; j < b.length; j++) b[j].setAttribute("aria-expanded", "false"); openMenu = null; }
  function act(a, t) {
    var S = LOOK.state;
    if (a === "v-overview") LOOK.set({ view: "overview" });
    else if (a === "v-ops") LOOK.set({ view: "ops" });
    else if (a === "tree") LOOK.set({ tree: S.tree === "full" ? "hidden" : "full" });
    else if (a === "m-light") LOOK.set({ mode: "light" });
    else if (a === "m-dark") LOOK.set({ mode: "dark" });
    else if (a === "density") LOOK.set({ density: S.density === "compact" ? "normal" : "compact" });
    else if (a === "settings") { dlgOpen = true; LOOK.apply(); var f = document.querySelector('#dlg select'); if (f) f.focus(); }
    else if (a === "close-settings") { dlgOpen = false; LOOK.apply(); }
    else if (a === "refresh") { msg = "Refreshed at 22:51"; LOOK.apply(); }
    else if (a === "open") { msg = sel ? "Opened " + sel + " (not part of this mockup)" : "Select an item first"; LOOK.apply(); }
    else if (a === "mark") { if (sel) { done[sel] = !done[sel]; msg = (done[sel] ? "Marked done: " : "Reopened: ") + sel; } else msg = "Select an item first"; LOOK.apply(); }
    else if (a === "about") { msg = "Look Q: Classic Desktop. Mockup with example data."; LOOK.apply(); }
    else if (a === "stub") { msg = (t.getAttribute("data-label") || "That page") + " is not part of this mockup."; LOOK.apply(); }
  }
  document.addEventListener("click", function (e) {
    var m = e.target.closest ? e.target.closest("[data-menu]") : null;
    if (m) { var id = m.getAttribute("data-menu"), dd = document.getElementById("m-" + id), was = dd.classList.contains("open"); closeMenus(); if (!was) { dd.classList.add("open"); m.setAttribute("aria-expanded", "true"); openMenu = m; } return; }
    var r = e.target.closest ? e.target.closest("tr.row") : null;
    if (r) { sel = r.getAttribute("data-id"); LOOK.apply(); return; }
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    closeMenus();
    if (t) act(t.getAttribute("data-act"), t);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { if (openMenu) { var b = openMenu; closeMenus(); b.focus(); } }
    else if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr.row")) { e.preventDefault(); sel = e.target.getAttribute("data-id"); LOOK.apply(); var n = document.querySelector('tr.row[data-id="' + sel + '"]'); if (n) n.focus(); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.matches && e.target.matches("tr.row")) { e.preventDefault(); var n2 = e.key === "ArrowDown" ? e.target.nextElementSibling : e.target.previousElementSibling; if (n2) n2.focus(); }
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && openMenu) { var items = [].slice.call(document.querySelectorAll("#m-" + openMenu.getAttribute("data-menu") + " button")); var i = items.indexOf(document.activeElement); i = e.key === "ArrowDown" ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1); e.preventDefault(); items[i].focus(); }
  });
  LOOK.init();
  /* contrast: the pairs this look puts text on, over all 18 themes x light/dark. face = line mixed 78% with panel, as in the CSS. */
  window.LOOK_PAIRS = function (k, u) {
    var face = u.mix(k.line, 78, k.panel);
    return [
      { label: "fg-strong on face (window, menus, buttons, tabs)", fg: k["fg-strong"], bg: face, min: 4.5 },
      { label: "fg on face", fg: k.fg, bg: face, min: 4.5 },
      { label: "fg-strong on panel (list views, tree, fields)", fg: k["fg-strong"], bg: k.panel, min: 4.5 },
      { label: "accent-ink on accent (title bar, menu hover, selection)", fg: k["accent-ink"], bg: k.accent, min: 4.5 },
      { label: "panel on fg-dim (inactive title bar)", fg: k.panel, bg: k["fg-dim"], min: 4.5 },
      { label: "fg-dim on panel (dotted row rules only, not text)", fg: k["fg-dim"], bg: k.panel, min: 3 }
    ];
  };
  if (/contrast=1/.test(location.hash)) { var pre = document.createElement("pre"); pre.id = "contrast-report"; pre.textContent = JSON.stringify(window.LOOK_CONTRAST(window.LOOK_PAIRS)); document.body.appendChild(pre); } /* dev check: open with #contrast=1 */
})();
