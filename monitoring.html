<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.barnyard.site; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Monitoring &middot; Barnyard</title>
<link rel="stylesheet" href="shell.css?v=870e98a5">
<link rel="stylesheet" href="monitoring.css?v=e1efb70c">
<script src="themes.js?v=e151fb94"></script>
</head>
<body data-shell="monitor" data-wide>

<main id="page" class="content">
  <div class="page-head">
    <div>
      <h1>Monitoring</h1>
      <p>Whether the servers and sites are up, who gets told when they are not, and where to look when something needs fixing. Checks run every 5 minutes from the Worker.</p>
    </div>
    <div class="mo-tools">
      <button type="button" class="btn btn-sm btn-quiet" id="mon-refresh">Refresh</button>
      <span class="dim" id="mon-stamp"></span>
    </div>
  </div>
  <div id="mon-flash" class="mo-flash" role="status" hidden></div>
  <div class="mo-tabs" id="mon-tabs" role="tablist" aria-label="Monitoring sections" hidden>
    <button type="button" class="mo-tab on" id="tab-dashboard" role="tab" aria-selected="true" aria-controls="mon-panel">Dashboard</button>
    <button type="button" class="mo-tab" id="tab-settings" role="tab" aria-selected="false" aria-controls="mon-panel" tabindex="-1">Settings</button>
  </div>
  <div id="mon-root">
    <p class="dim">Loading&hellip;</p>
  </div>
</main>

<script src="shell.js?v=d51f318e"></script>
<script src="auth-gate.js?v=a1b7693a"></script>
<script src="monitoring.js?v=8929343b"></script>
</body>
</html>
