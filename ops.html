<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- connect-src needs wss:// spelled out: https://api.barnyard.site does not
     cover the WebSocket that carries the live updates. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.barnyard.site wss://api.barnyard.site; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none';">
<meta name="robots" content="noindex">
<title>Ops board &middot; Barnyard</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="ops.css">
<script src="themes.js"></script>
</head>
<body data-shell="ops">

<main id="page" class="content">
  <div class="page-head">
    <div>
      <h1>Ops board</h1>
      <p>Everything in flight across the projects on this account. It updates as work happens.</p>
    </div>
  </div>
  <div id="ops-root" aria-label="Ops board">
    <p class="ops-empty">Loading&hellip;</p>
  </div>
</main>

<script src="shell.js"></script>
<script src="auth-gate.js"></script>
<script src="agent-setup.js"></script>
<script src="ops.js"></script>
</body>
</html>
